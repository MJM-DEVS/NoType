# Copy to .github/workflows/ci.yml to enable (pushing workflow files needs the "workflow" token scope).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Check JavaScript syntax
        run: find electron tools -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      # No npm install needed; passes when there are no tests yet.
      - name: Node tests
        working-directory: electron
        run: node --test
