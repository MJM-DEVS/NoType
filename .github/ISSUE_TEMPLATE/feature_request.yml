name: Feature request
description: An idea for NoType
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could NoType help?
      description: Your idea of how it could work. Rough is fine.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      description: NoType keeps dictation on your PC. Ideas that need a cloud service or send text somewhere by default are unlikely to be added.
      options:
        - label: My idea works without sending dictated text off the PC, or only after the user turns it on.
  - type: input
    id: version
    attributes:
      label: NoType version you use
      placeholder: "3.3.0"
