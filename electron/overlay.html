<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoType Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ── Live transcript caption (sits above the animation) ── */
  body.with-preview { padding-top: 30px; }
  #livePreview {
    position: fixed; top: 3px; left: 50%; transform: translateX(-50%);
    max-width: 94%; padding: 4px 14px; border-radius: 12px;
    background: rgba(20, 22, 28, 0.72); color: rgba(255, 255, 255, 0.96);
    font-size: 12.5px; line-height: 1.3;
    white-space: nowrap; overflow: hidden;
    /* rtl container + ltr content: overflow clips the OLD text on the left,
       the newest words on the right always stay visible */
    direction: rtl;
    opacity: 0; transition: opacity 0.25s ease;
    pointer-events: none;
    backdrop-filter: blur(6px);
  }
  #livePreview > span { direction: ltr; unicode-bidi: embed; }
  #livePreview.visible { opacity: 1; }

  /* Show only the active style */
  .style { display: none; }
  body[data-style="wave_classic"] .style-wave-classic,
  body[data-style="wave"]         .style-wave,
  body[data-style="aurora"]       .style-aurora,
  body[data-style="particles"]    .style-particles,
  body[data-style="pulse"]        .style-pulse,
  body[data-style="ribbon"]       .style-ribbon,
  body[data-style="spectrum"]     .style-spectrum { display: flex; }
  body[data-style="amoled_top"]    .style-amoled-bar,
  body[data-style="amoled_bottom"] .style-amoled-bar,
  body[data-style="amoled_center"] .style-amoled-center { display: flex; }

  /* ═══════════════════════════════════════════════════════════════
     AMOLED family – pure black, brand-mint synth, transcript inside.
     The external caption is redundant here.
     ═══════════════════════════════════════════════════════════════ */
  body[data-style^="amoled"] #livePreview { display: none !important; }
  body[data-style^="amoled"] { padding-top: 0 !important; }

  .style-amoled-bar, .style-amoled-center {
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    /* Breathing room so the outer glow fades out INSIDE the transparent
       window – a glow that reaches the window edge gets clipped into a
       visible rectangular gradient. Keep padding > blur radius. */
    padding: 14px; box-sizing: border-box;
  }
  .ampill {
    width: 100%; height: 100%;
    background: #000;
    border: 1px solid rgba(0, 212, 170, 0.32);
    border-radius: 999px;
    box-shadow: 0 0 12px rgba(0, 212, 170, 0.16),
                inset 0 0 20px rgba(0, 212, 170, 0.05);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px 0 16px; box-sizing: border-box;
    overflow: hidden;
  }
  .ampill canvas { width: 150px; height: 38px; flex: 0 0 auto; }
  .amtext {
    flex: 1; min-width: 0;
    color: #eafff9; font-size: 13.5px; line-height: 1.3;
    white-space: nowrap; overflow: hidden;
    /* rtl container + ltr span: clip OLD words left, newest stay visible */
    direction: rtl; text-align: left;
  }
  .amtext > span { direction: ltr; unicode-bidi: embed; }
  .amtext > span.dim { color: rgba(0, 212, 170, 0.55); }
  /* Live preview off → pill/card shows only the synth */
  body:not(.with-preview) .amtext { display: none; }

  /* ── Processing → done: the overlay stays up while the final pass runs
     (instead of vanishing on key-release), shows a sweep on the pill and
     flashes mint once the text is inserted. ── */
  .ampill, .amcard { position: relative; }
  .ampill::after, .amcard::after {
    content: ''; position: absolute; left: 18%; right: 18%; bottom: 0; height: 2px;
    border-radius: 2px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,212,170,0) 0%, #00d4aa 50%, rgba(0,212,170,0) 100%);
    transform: translateX(-70%);
  }
  body.processing .ampill::after, body.processing .amcard::after {
    opacity: 1; animation: amSweep 0.9s linear infinite;
  }
  @keyframes amSweep { from { transform: translateX(-70%); } to { transform: translateX(70%); } }
  body.processing .amtext > span { color: rgba(234, 255, 249, 0.55); }
  body.processing #livePreview { opacity: 0.55; }
  body.done .ampill, body.done .amcard {
    border-color: rgba(0, 212, 170, 0.95);
    box-shadow: 0 0 20px rgba(0, 212, 170, 0.5), inset 0 0 20px rgba(0, 212, 170, 0.08);
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  body.done .amtext > span { color: #eafff9; }
  body.done #livePreview { box-shadow: 0 0 0 1px rgba(0, 212, 170, 0.85), 0 0 14px rgba(0, 212, 170, 0.35); opacity: 1; }
  /* Hotkey pressed while still processing: short nudge, plus a low blip. */
  body.busy .ampill, body.busy .amcard, body.busy #livePreview { animation: amBusy 0.28s ease; }
  @keyframes amBusy { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
  body.busy #livePreview { animation-name: amBusyCaption; }
  @keyframes amBusyCaption { 0%, 100% { transform: translateX(-50%); } 30% { transform: translateX(calc(-50% - 4px)); } 60% { transform: translateX(calc(-50% + 4px)); } }

  .amcard {
    width: 100%; height: 100%;
    background: #000;
    border: 1px solid rgba(0, 212, 170, 0.32);
    border-radius: 28px;
    box-shadow: 0 0 12px rgba(0, 212, 170, 0.2),
                inset 0 0 28px rgba(0, 212, 170, 0.04);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: 24px 28px; box-sizing: border-box; overflow: hidden;
  }
  .amcard canvas { width: 100%; height: 92px; flex: 0 0 auto; }
  .amcard .amtext { flex: 0 0 auto; width: 100%; text-align: center; font-size: 14.5px; }

  /* ═══════════════════════════════════════════════════════════════
     1. WAVE CLASSIC  (600×48 – original ethereal sine)
     ═══════════════════════════════════════════════════════════════ */
  .style-wave-classic {
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    animation: fadeUp 0.4s ease-out;
  }
  .style-wave-classic svg { width: 100%; height: 100%; overflow: visible; }
  .style-wave-classic path {
    fill: none;
    stroke: url(#wcGrad);
    stroke-width: 2;
    stroke-linecap: round;
    filter: drop-shadow(0 0 4px rgba(0,212,170,0.55)) drop-shadow(0 0 12px rgba(0,212,170,0.25));
  }

  /* ═══════════════════════════════════════════════════════════════
     2. WAVE  (600×72 – multilayer waves, Apple Siri vibe)
     ═══════════════════════════════════════════════════════════════ */
  .style-wave {
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    animation: fadeUp 0.4s ease-out;
  }
  .style-wave svg { width: 100%; height: 100%; overflow: visible; }
  .style-wave .layer1 { fill: none; stroke: url(#wGradA); stroke-width: 3.5; stroke-linecap: round;
                        filter: drop-shadow(0 0 10px rgba(0,212,170,0.85))
                                drop-shadow(0 0 20px rgba(0,212,170,0.4)); opacity: 1; }
  .style-wave .layer2 { fill: none; stroke: url(#wGradB); stroke-width: 2.2; stroke-linecap: round;
                        filter: drop-shadow(0 0 8px rgba(110,231,196,0.7)); opacity: 0.85; }
  .style-wave .layer3 { fill: none; stroke: url(#wGradC); stroke-width: 1.5; stroke-linecap: round;
                        filter: drop-shadow(0 0 6px rgba(61,199,255,0.5)); opacity: 0.65; }

  /* ═══════════════════════════════════════════════════════════════
     3. AURORA  (168×168 – compact swirling orb, cohesive cool palette)
        Smaller and calmer than before; a brand-aligned teal→aqua→sky
        gradient instead of a full rainbow. Clipped to a circle so the
        blurred blobs never show square corners.
     ═══════════════════════════════════════════════════════════════ */
  .style-aurora {
    position: relative;
    width: 168px; height: 168px;
    align-items: center; justify-content: center;
    animation: fadeScale 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    clip-path: circle(50% at 50% 50%);
    -webkit-clip-path: circle(50% at 50% 50%);
  }
  .style-aurora .aurora-blob {
    position: absolute; inset: 13px;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      #00d4aa 0%, #19c6c8 30%, #38b0e8 52%, #6ee7c4 74%, #00d4aa 100%);
    filter: blur(13px);
    will-change: transform;
  }
  .style-aurora .aurora-blob2 {
    position: absolute; inset: 32px;
    border-radius: 50%;
    background: conic-gradient(from 180deg,
      #b7f5e3 0%, #6ee7c4 35%, #38d0e0 70%, #b7f5e3 100%);
    filter: blur(10px);
    opacity: 0.55;
    will-change: transform;
  }
  /* Pre-blurred glow behind the core – scaled/faded via transform in JS. */
  .style-aurora .aurora-glow {
    position: absolute; inset: 56px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(0,212,170,0.35) 45%, rgba(0,212,170,0) 72%);
    filter: blur(5px);
    z-index: 1;
    will-change: transform, opacity;
  }
  .style-aurora .aurora-core {
    position: relative; z-index: 2;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.5) 55%, rgba(255,255,255,0) 100%);
    will-change: transform;
  }

  /* ═══════════════════════════════════════════════════════════════
     4. PARTICLES  (640×96 – flowing particle stream)
     ═══════════════════════════════════════════════════════════════ */
  .style-particles {
    position: relative;
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    animation: fadeUp 0.4s ease-out;
  }
  .style-particles canvas {
    width: 100%; height: 100%;
  }

  /* ═══════════════════════════════════════════════════════════════
     5. PULSE  (180×180 – breathing circle with concentric ripples)
     ═══════════════════════════════════════════════════════════════ */
  .style-pulse {
    position: relative;
    width: 180px; height: 180px;
    align-items: center; justify-content: center;
    animation: fadeScale 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .style-pulse .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(0, 212, 170, 0.55);
    will-change: transform, opacity;
  }
  /* Slower, calmer pulse – 4.5s cycle, ~2.25s between staggered ripples.
     cubic-bezier(0.22, 1, 0.36, 1) is "ease-out-quart" → soft swell, no snap. */
  .style-pulse .ripple.r1 { inset: 50px; animation: rippleSoft 4.5s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
  .style-pulse .ripple.r2 { inset: 50px; animation: rippleSoft 4.5s cubic-bezier(0.22, 1, 0.36, 1) infinite 1.5s; }
  .style-pulse .ripple.r3 { inset: 50px; animation: rippleSoft 4.5s cubic-bezier(0.22, 1, 0.36, 1) infinite 3.0s; }
  @keyframes rippleSoft {
    0%   { transform: scale(0.55); opacity: 0; border-color: rgba(0, 212, 170, 0); }
    15%  { opacity: 0.85; border-color: rgba(0, 212, 170, 0.85); }
    100% { transform: scale(1.85); opacity: 0; border-color: rgba(0, 212, 170, 0); }
  }
  /* A glossy 3D sphere: a deep off-center radial body, a bright top-left
     specular highlight, a dark bottom rim shadow and a thin top rim light.
     box-shadow stays STATIC (GPU-safe); amplitude reaction = .pulse-glow. */
  .style-pulse .pulse-core {
    position: relative; z-index: 2;
    width: 96px; height: 96px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 36% 28%, #d6fbf0 0%, #7ef0d2 22%, #12cba6 52%, #009e7c 78%, #00674f 100%);
    box-shadow: 0 0 36px rgba(0,212,170,0.5),
                inset 0 3px 2px rgba(255,255,255,0.45),
                inset 0 -10px 16px rgba(0,70,54,0.55),
                inset 0 0 0 1px rgba(255,255,255,0.10);
    will-change: transform;
  }
  /* Specular highlight – the glossy hotspot that sells the 3D sphere. */
  .style-pulse .pulse-spec {
    position: absolute; z-index: 3;
    width: 34px; height: 24px;
    left: 50%; top: 50%;
    transform: translate(-118%, -150%) rotate(-18deg);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 45%, rgba(255,255,255,0) 75%);
    filter: blur(2px);
    pointer-events: none;
  }
  .style-pulse .pulse-glow {
    position: absolute; inset: 18px; z-index: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,170,0.6) 0%, rgba(0,212,170,0) 70%);
    filter: blur(14px);
    will-change: transform, opacity;
  }

  /* ═══════════════════════════════════════════════════════════════
     6. RIBBON  (600×88 – flowing 3D band with shaded body + edge light)
        A filled band (vertical gradient = light hitting the top, shadow
        underneath) gives real volume instead of flat strokes; a bright
        top-edge highlight and an offset back-shadow add depth.
     ═══════════════════════════════════════════════════════════════ */
  .style-ribbon {
    width: 100%; height: 100%;
    align-items: center; justify-content: center;
    animation: fadeUp 0.4s ease-out;
  }
  .style-ribbon svg { width: 100%; height: 100%; overflow: visible; }
  .style-ribbon .ribbon-shadow {
    fill: #00352a; opacity: 0.45;
    filter: blur(5px);
    transform: translateY(7px);
  }
  .style-ribbon .ribbon-body {
    fill: url(#ribBody);
    filter: drop-shadow(0 0 10px rgba(0,212,170,0.35));
  }
  .style-ribbon .ribbon-top {
    fill: none; stroke: #d6fbf0; stroke-width: 2; stroke-linecap: round;
    opacity: 0.9;
    filter: drop-shadow(0 0 4px rgba(214,251,240,0.6));
  }

  /* ═══════════════════════════════════════════════════════════════
     7. SPECTRUM  (320×100 – gradient FFT bars with reflection)
     ═══════════════════════════════════════════════════════════════ */
  /* GPU-safe: NO backdrop-filter. On a transparent always-on-top window it
     forces DWM to re-sample the live desktop behind the card every single
     frame while 36 bars change height – the costliest per-frame effect.
     A solid translucent fill gives the same glass look without the cost. */
  .style-spectrum {
    position: relative;
    width: 320px; height: 104px;
    align-items: end;
    padding: 16px 16px 14px;
    gap: 3px;
    background: linear-gradient(180deg, rgba(20,22,32,0.94) 0%, rgba(9,10,15,0.96) 100%);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08),
                inset 0 -1px 0 rgba(0,0,0,0.35);
    overflow: hidden;
    animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  /* Soft mint floor-glow for depth under the bars. */
  .style-spectrum::before {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -24px; height: 64px;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,212,170,0.30), rgba(0,212,170,0) 70%);
    pointer-events: none;
  }
  .style-spectrum .sb {
    position: relative;
    flex: 1; min-height: 3px;
    border-radius: 3px 3px 1px 1px;
    background: linear-gradient(to top,
      rgba(0,150,120,0.0) 0%,
      rgba(0,200,160,0.55) 22%,
      rgba(54,224,196,0.95) 62%,
      #c9fbef 100%);
    box-shadow: 0 0 8px rgba(0,212,170,0.55);
    transition: height 0.05s ease-out;
    will-change: height;
  }
  /* Bright glowing cap at the tip of each bar. */
  .style-spectrum .sb::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: 3px;
    background: #e8fef8;
    box-shadow: 0 0 6px rgba(201,251,239,0.9);
  }

  /* ─── Shared keyframes ─────────────────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeScale {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body data-style="wave">

  <!-- ── Live transcript caption ── -->
  <div id="livePreview"><span id="livePreviewText"></span></div>

  <!-- ── 1. WAVE CLASSIC (original) ── -->
  <div class="style style-wave-classic">
    <svg viewBox="0 0 600 40" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wcGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#00d4aa" stop-opacity="0"/>
          <stop offset="20%"  stop-color="#00d4aa" stop-opacity="1"/>
          <stop offset="80%"  stop-color="#6ee7c4" stop-opacity="1"/>
          <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="wcPath" d="M 0 20 L 600 20" />
    </svg>
  </div>

  <!-- ── 2. WAVE (multilayer) ── -->
  <div class="style style-wave">
    <svg viewBox="0 0 600 64" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wGradA" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#00d4aa" stop-opacity="0"/>
          <stop offset="15%"  stop-color="#00d4aa" stop-opacity="1"/>
          <stop offset="50%"  stop-color="#6ee7c4" stop-opacity="1"/>
          <stop offset="85%"  stop-color="#00d4aa" stop-opacity="1"/>
          <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="wGradB" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#6ee7c4" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#b7f5e3" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#6ee7c4" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="wGradC" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#3dc7ff" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#3dc7ff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#3dc7ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="wPath1" class="layer1" d="M 0 32 L 600 32" />
      <path id="wPath2" class="layer2" d="M 0 32 L 600 32" />
      <path id="wPath3" class="layer3" d="M 0 32 L 600 32" />
    </svg>
  </div>

  <!-- ── 3. AURORA ── -->
  <div class="style style-aurora">
    <div class="aurora-blob"></div>
    <div class="aurora-blob2"></div>
    <div class="aurora-glow" id="auroraGlow"></div>
    <div class="aurora-core" id="auroraCore"></div>
  </div>

  <!-- ── 4. PARTICLES (canvas-rendered) ── -->
  <div class="style style-particles">
    <canvas id="particlesCanvas"></canvas>
  </div>

  <!-- ── 5. PULSE ── -->
  <div class="style style-pulse">
    <div class="pulse-glow" id="pulseGlow"></div>
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
    <div class="pulse-core" id="pulseCore"></div>
    <div class="pulse-spec"></div>
  </div>

  <!-- ── 6. RIBBON ── -->
  <div class="style style-ribbon">
    <svg viewBox="0 0 600 88" preserveAspectRatio="none">
      <defs>
        <linearGradient id="ribBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#9af3da" stop-opacity="0.95"/>
          <stop offset="45%"  stop-color="#1fd6ab" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#006f56" stop-opacity="0.55"/>
        </linearGradient>
      </defs>
      <path id="ribShadow"   class="ribbon-shadow" d="" />
      <path id="ribBodyPath" class="ribbon-body"   d="" />
      <path id="ribTop"      class="ribbon-top"    d="" />
    </svg>
  </div>

  <!-- ── 7. SPECTRUM ── -->
  <div class="style style-spectrum" id="spectrum"></div>

  <!-- ── AMOLED bar (top/bottom) & card (center) ── -->
  <div class="style style-amoled-bar">
    <div class="ampill">
      <canvas id="amBarCanvas"></canvas>
      <div class="amtext"><span id="amBarText" class="dim">Ich höre zu…</span></div>
    </div>
  </div>
  <div class="style style-amoled-center">
    <div class="amcard">
      <canvas id="amCenterCanvas"></canvas>
      <div class="amtext"><span id="amCenterText" class="dim">Ich höre zu…</span></div>
    </div>
  </div>

<script>
  // ── State ────────────────────────────────────────────────────────
  let amplitude = 0.15;
  let targetAmp = 0.15;
  let frame = 0;
  let currentStyle = 'wave';
  let listenText = 'Ich höre zu…';   // swapped by app-lang IPC
  let processingText = 'Verarbeite…';

  // ── Build spectrum bars ──
  const SPEC_BAR_COUNT = 36;
  const specEl = document.getElementById('spectrum');
  const specBars = [];
  for (let i = 0; i < SPEC_BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'sb';
    specEl.appendChild(b);
    specBars.push(b);
  }

  // ── Particles canvas setup ──
  const particlesCanvas = document.getElementById('particlesCanvas');
  const particlesCtx = particlesCanvas.getContext('2d');
  function resizeParticlesCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = particlesCanvas.getBoundingClientRect();
    particlesCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
    particlesCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
    particlesCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  // Spawn 100 depth-layered particles. `depth` (0 far … 1 near) drives size,
  // speed and brightness for a parallax sense of depth. The array is kept in
  // far→near order so painter's-order layering is correct without per-frame
  // sorting; respawns preserve a particle's depth band.
  const PARTICLE_COUNT = 100;
  const particles = [];
  function makeParticle(seedX, depth) {
    const d = depth != null ? depth : Math.random();
    return {
      x: seedX != null ? seedX : Math.random() * 640,
      y: 48 + (Math.random() - 0.5) * 38,
      vx: 0.5 + d * 1.7,                 // near particles move faster
      vy: (Math.random() - 0.5) * 0.5,
      r: 0.8 + d * 2.8,                  // near particles are bigger
      depth: d,
      life: 0,
      maxLife: 90 + Math.random() * 90,
    };
  }
  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(makeParticle(undefined, i / PARTICLE_COUNT));
  setTimeout(resizeParticlesCanvas, 0);
  window.addEventListener('resize', resizeParticlesCanvas);

  // GPU-safe particles: pre-render ONE soft mint halo sprite to an offscreen
  // canvas ONCE, then drawImage it per particle. This removes ~80
  // createRadialGradient() allocations + 80 arc-fills PER FRAME (the dominant
  // cost of this style). drawImage of a cached bitmap is cheap and GPU-friendly.
  const SPRITE_SIZE = 64;
  const haloSprite = document.createElement('canvas');
  haloSprite.width = haloSprite.height = SPRITE_SIZE;
  {
    const sctx = haloSprite.getContext('2d');
    const c = SPRITE_SIZE / 2;
    const g = sctx.createRadialGradient(c, c, 0, c, c, c);
    g.addColorStop(0,   'rgba(183,245,227,1)');   // bright mint core
    g.addColorStop(0.4, 'rgba(0,212,170,0.45)');
    g.addColorStop(1,   'rgba(0,212,170,0)');
    sctx.fillStyle = g;
    sctx.beginPath();
    sctx.arc(c, c, c, 0, Math.PI * 2);
    sctx.fill();
  }

  // ── References ──
  const wcPath = document.getElementById('wcPath');
  const wPath1 = document.getElementById('wPath1');
  const wPath2 = document.getElementById('wPath2');
  const wPath3 = document.getElementById('wPath3');
  const ribShadow = document.getElementById('ribShadow');
  const ribBody = document.getElementById('ribBodyPath');
  const ribTop = document.getElementById('ribTop');
  const auroraCore = document.getElementById('auroraCore');
  const auroraGlow = document.getElementById('auroraGlow');
  const auroraBlob = document.querySelector('.style-aurora .aurora-blob');
  const auroraBlob2 = document.querySelector('.style-aurora .aurora-blob2');
  const pulseCore = document.getElementById('pulseCore');
  const pulseGlow = document.getElementById('pulseGlow');

  // ── Chime sounds (Web Audio) ─────────────────────────────────────
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext();
    return audioCtx;
  }
  function playChime(type) {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const freqs = type === 'start' ? [523, 659] : [659, 523];
    const peak = type === 'start' ? 0.15 : 0.12;
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + i * 0.12);
      gain.gain.linearRampToValueAtTime(peak, now + i * 0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.12);
      osc.stop(now + i * 0.12 + 0.35);
    });
  }

  // Hotkey pressed while the previous dictation is still being transcribed:
  // a short, low blip so the press doesn't feel dead (the normal start chime
  // only plays when a recording actually starts).
  function playBusy() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = 330;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.09, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.15);
  }

  // ── Per-style renderers ──────────────────────────────────────────

  function renderWaveClassic(t, amp) {
    const W = 600, CY = 20, steps = 60;
    let d = `M 0 ${CY}`;
    for (let i = 1; i <= steps; i++) {
      const x = (i / steps) * W;
      let y = Math.sin(t * 1.0 + i * 0.32) * 6
            + Math.sin(t * 1.9 + i * 0.18) * 4
            + Math.sin(t * 3.1 + i * 0.45) * 2;
      const n = i / steps;
      const edge = Math.min(1, Math.min(n, 1 - n) / 0.18);
      y *= edge * (amp + 0.1);
      d += ` L ${x.toFixed(1)} ${(CY + y).toFixed(2)}`;
    }
    wcPath.setAttribute('d', d);
  }

  function renderWave(t, amp) {
    const W = 600, CY = 32, steps = 90;
    const buildPath = (freq, phase, mag) => {
      let d = `M 0 ${CY}`;
      for (let i = 1; i <= steps; i++) {
        const x = (i / steps) * W;
        let y = Math.sin(t * freq + i * 0.25 + phase) * mag * 0.55
              + Math.sin(t * (freq * 1.7) + i * 0.4 + phase) * mag * 0.4
              + Math.sin(t * (freq * 3.1) + i * 0.15 + phase) * mag * 0.2;
        const n = i / steps;
        const edge = Math.min(1, Math.min(n, 1 - n) / 0.18);
        y *= edge * (amp + 0.12);
        d += ` L ${x.toFixed(1)} ${(CY + y).toFixed(2)}`;
      }
      return d;
    };
    // Bigger magnitudes – more visible at the same calm speed.
    wPath1.setAttribute('d', buildPath(0.9, 0,     26));
    wPath2.setAttribute('d', buildPath(1.3, 1.6,   20));
    wPath3.setAttribute('d', buildPath(0.6, 3.2,   14));
  }

  function renderAurora(t, amp) {
    // Core breathes via transform only (cheap). The glow reaction is the
    // pre-blurred .aurora-glow element scaled + faded – NO per-frame box-shadow.
    const coreScale = 1 + amp * 0.5 + Math.sin(t * 1.4) * 0.05;
    auroraCore.style.transform = `scale(${coreScale.toFixed(3)})`;
    auroraGlow.style.transform = `scale(${(1 + amp * 0.8).toFixed(3)})`;
    auroraGlow.style.opacity = (0.6 + amp * 0.4).toFixed(2);

    // Blobs expand with amplitude – the perceived "pulsing from the inside".
    const blobScale = 1 + amp * 0.18 + Math.sin(t * 0.8) * 0.03;
    auroraBlob.style.transform = `rotate(${(t * 60).toFixed(1)}deg) scale(${blobScale.toFixed(3)})`;

    const blob2Scale = 1 + amp * 0.3 + Math.sin(t * 1.3) * 0.04;
    auroraBlob2.style.transform = `rotate(${(-t * 90).toFixed(1)}deg) scale(${blob2Scale.toFixed(3)})`;
  }

  function renderParticles(t, amp) {
    const ctx = particlesCtx;
    const w = particlesCanvas.clientWidth;
    const h = particlesCanvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // Always render all particles – visibility is controlled by an alpha curve
    // tied to position (fade-in left, fade-out right) so the user never sees
    // a hard pop-in or cut-off at the screen edge.
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx * (0.5 + amp * 1.5);
      p.y += p.vy + Math.sin(t * 1.4 + p.x * 0.018) * 0.5 * amp;
      p.life++;

      // Re-spawn just BEFORE the visible window so the fade-in is in front of
      // the viewer (looks like new particles materialise from thin air).
      // Preserve the depth band so the parallax layering stays stable.
      if (p.x > w + 40 || p.life > p.maxLife) {
        Object.assign(p, makeParticle(-40 - Math.random() * 60, p.depth));
        p.y = h / 2 + (Math.random() - 0.5) * h * 0.65;
      }

      // Position-based alpha curve:
      //   0%  ──►  fade in over first 18% of width
      //   18-82%  full visibility
      //   82-100%  fade out
      // Multiplied by amplitude (more particles "light up" when louder).
      const xT = p.x / w;
      let xFade;
      if (xT < 0)        xFade = 0;
      else if (xT < 0.18) xFade = xT / 0.18;
      else if (xT > 0.82) xFade = Math.max(0, (1 - xT) / 0.18);
      else                xFade = 1;
      // smoothstep so the fade is curve, not linear
      xFade = xFade * xFade * (3 - 2 * xFade);

      // Depth drives brightness: near particles brighter, far ones dimmer.
      const baseAlpha = xFade * (0.35 + p.depth * 0.5) * (0.6 + amp * 0.5);
      if (baseAlpha < 0.01) continue;  // skip invisible particles entirely

      // Glow halo: draw the cached sprite (no per-frame gradient allocation).
      const haloR = p.r * 5.5 + amp * 7;
      const d = haloR * 2;
      ctx.globalAlpha = Math.min(1, baseAlpha);
      ctx.drawImage(haloSprite, p.x - haloR, p.y - haloR, d, d);
    }
    ctx.globalAlpha = 1;
  }

  function renderPulse(t, amp) {
    // Core breathes via transform only; the box-shadow is now STATIC (CSS).
    // The amplitude glow reaction is the pre-blurred .pulse-glow element scaled
    // + faded – no per-frame box-shadow recomputation (which re-rasterizes).
    const coreScale = 1 + amp * 0.45 + Math.sin(t * 0.9) * 0.03;
    pulseCore.style.transform = `scale(${coreScale.toFixed(3)})`;
    pulseGlow.style.transform = `scale(${(1 + amp * 0.9).toFixed(3)})`;
    pulseGlow.style.opacity = (0.55 + amp * 0.45).toFixed(2);
  }

  function renderRibbon(t, amp) {
    // Slower, calmer wave – frequencies roughly halved from the previous
    // hyperactive version. More control points (10 instead of 6) for visibly
    // smoother curves at the cost of a few extra path segments.
    // A 3D band: compute a centre spine wave, then a variable thickness that
    // tapers to 0 at both ends. The band is the area between the top and
    // bottom edges, filled with a vertical gradient (light top → dark bottom).
    const W = 600, CY = 44, STEPS = 22;
    const top = [], bot = [], topPts = [];
    for (let i = 0; i <= STEPS; i++) {
      const x = (i / STEPS) * W;
      const n = i / STEPS;
      const edge = Math.min(1, Math.min(n, 1 - n) / 0.16);
      const smooth = edge * edge * (3 - 2 * edge);
      const yc = CY + (
        Math.sin(t * 0.45 + i * 0.55) * 12 +
        Math.sin(t * 0.85 + i * 0.32) * 6
      ) * smooth * (amp + 0.2);
      const th = (6 + (amp + 0.1) * 26) * smooth;   // thickness tapers at ends
      top.push({ x, y: yc - th / 2 });
      bot.push({ x, y: yc + th / 2 });
      topPts.push({ x, y: yc - th / 2 });
    }
    // Smooth quadratic path through a point list (open).
    const smoothOpen = (pts) => {
      let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(2)}`;
      for (let i = 1; i < pts.length; i++) {
        const xc = (pts[i - 1].x + pts[i].x) / 2;
        const yc = (pts[i - 1].y + pts[i].y) / 2;
        d += ` Q ${pts[i - 1].x.toFixed(1)} ${pts[i - 1].y.toFixed(2)} ${xc.toFixed(1)} ${yc.toFixed(2)}`;
      }
      d += ` T ${pts[pts.length - 1].x.toFixed(1)} ${pts[pts.length - 1].y.toFixed(2)}`;
      return d;
    };
    // Closed band: top edge L→R, then bottom edge R→L, close.
    let band = `M ${top[0].x.toFixed(1)} ${top[0].y.toFixed(2)}`;
    for (let i = 1; i <= STEPS; i++) band += ` L ${top[i].x.toFixed(1)} ${top[i].y.toFixed(2)}`;
    for (let i = STEPS; i >= 0; i--) band += ` L ${bot[i].x.toFixed(1)} ${bot[i].y.toFixed(2)}`;
    band += ' Z';

    ribBody.setAttribute('d', band);
    ribShadow.setAttribute('d', band);
    ribTop.setAttribute('d', smoothOpen(topPts));
  }

  // ── AMOLED synth: mirrored rounded bars in the brand gradient ────
  const amBarCanvas = document.getElementById('amBarCanvas');
  const amCenterCanvas = document.getElementById('amCenterCanvas');
  const amBarCtx = amBarCanvas.getContext('2d');
  const amCenterCtx = amCenterCanvas.getContext('2d');
  const amGradients = new WeakMap();

  function sizeAmoledCanvas(canvas) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    if (r.width && r.height) {
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      amGradients.delete(canvas);  // gradient depends on width
    }
  }

  function renderAmoledSynth(ctx, canvas, t, amp) {
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return;
    ctx.clearRect(0, 0, W, H);

    let grad = amGradients.get(canvas);
    if (!grad) {
      grad = ctx.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0.0, '#00d4aa');
      grad.addColorStop(0.55, '#2ee9c6');
      grad.addColorStop(1.0, '#4dd0ff');
      amGradients.set(canvas, grad);
    }
    ctx.fillStyle = grad;

    const N = Math.max(20, Math.round(W / (H * 0.42)));
    const step = W / N;
    const barW = Math.max(2, step * 0.52);
    const mid = H / 2;

    for (let i = 0; i < N; i++) {
      const ph = i * 0.55;
      // Layered sines fake a lively frequency spectrum from plain amplitude
      let v = 0.42
        + 0.34 * Math.sin(t * 2.1 + ph)
        + 0.20 * Math.sin(t * 3.6 + ph * 1.7)
        + 0.12 * Math.sin(t * 5.3 + ph * 0.6);
      // Energy concentrates toward the middle – reads as "voice", not noise
      const centerBias = 0.28 + 0.72 * Math.exp(-0.5 * (((i - N / 2) / (N / 2.6)) ** 2));
      const h = Math.min(H * 0.94,
        Math.max(H * 0.08, Math.abs(v) * centerBias * amp * H * 1.9));
      const x = (i + 0.5) * step;
      ctx.beginPath();
      ctx.roundRect(x - barW / 2, mid - h / 2, barW, h, barW / 2);
      ctx.fill();
    }
  }

  function renderSpectrum(t, amp) {
    for (let i = 0; i < SPEC_BAR_COUNT; i++) {
      const freqWeight = Math.pow(1 - (i / SPEC_BAR_COUNT) * 0.55, 1.2);
      let w = 0;
      w += Math.sin(t * 1.4 + i * 0.4) * 0.4;
      w += Math.sin(t * 2.3 + i * 0.7) * 0.3;
      w += Math.sin(t * 3.7 + i * 0.25) * 0.2;
      const center = SPEC_BAR_COUNT / 2.6;
      const dist = Math.abs(i - center);
      const gauss = Math.exp(-0.5 * (dist / (SPEC_BAR_COUNT / 3)) ** 2);
      // Bigger scalar (110 instead of 80) – spectrum fills more of the card.
      const h = Math.max(4, (0.55 + w) * gauss * freqWeight * amp * 110);
      specBars[i].style.height = h.toFixed(1) + 'px';
    }
  }

  // ── Animation loop — HARD frame-rate cap via wall-clock time gate ──
  // Critical for GPU safety: a bare rAF loop renders at the monitor's refresh
  // rate, so on a 144/240/360 Hz panel it does 2.4-6x the blur/blend/canvas
  // work of 60 Hz (and runs the frame-count-driven animation that much faster).
  // Gating on elapsed time caps composite/raster cost to TARGET_FPS regardless
  // of refresh rate AND normalises animation speed across all monitors.
  const TARGET_FPS = 40;
  const FRAME_MS = 1000 / TARGET_FPS;
  let lastFrameTs = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (document.hidden) return;                 // idle: render nothing
    if (ts - lastFrameTs < FRAME_MS) return;     // drop extra frames on high-Hz panels
    lastFrameTs = ts;

    frame++;
    amplitude += (targetAmp - amplitude) * 0.2;
    const amp = Math.max(amplitude, 0.08);
    const t = frame * 0.10;

    switch (currentStyle) {
      case 'wave_classic': renderWaveClassic(t, amp); break;
      case 'wave':         renderWave(t, amp); break;
      case 'aurora':       renderAurora(t, amp); break;
      case 'particles':    renderParticles(t, amp); break;
      case 'pulse':        renderPulse(t, amp); break;
      case 'ribbon':       renderRibbon(t, amp); break;
      case 'spectrum':     renderSpectrum(t, amp); break;
      case 'amoled_top':
      case 'amoled_bottom': renderAmoledSynth(amBarCtx, amBarCanvas, t, amp); break;
      case 'amoled_center': renderAmoledSynth(amCenterCtx, amCenterCanvas, t, amp); break;
    }
  }
  requestAnimationFrame(loop);

  // ── IPC ──────────────────────────────────────────────────────────
  if (window.notype) {
    window.notype.onAmplitude((val) => { targetAmp = Math.max(val, 0.08); });
    window.notype.onRecordingStarted(() => {
      targetAmp = 0.15;
      document.body.classList.remove('processing', 'done', 'busy');
      // Particle stream reset
      for (let i = 0; i < particles.length; i++) {
        Object.assign(particles[i], makeParticle());
      }
      resizeParticlesCanvas();
      // Stale caption from the previous dictation
      document.getElementById('livePreview').classList.remove('visible');
      document.getElementById('livePreviewText').textContent = '';
      for (const id of ['amBarText', 'amCenterText']) {
        const el = document.getElementById(id);
        el.textContent = listenText;
        el.classList.add('dim');
      }
      playChime('start');
    });
    window.notype.onRecordingStopped(() => {
      playChime('stop');
      // Stay visible while the final pass runs; the animation settles and the
      // pill shows a sweep. main.js hides us after 'transcription-done'.
      targetAmp = 0.08;
      document.body.classList.add('processing');
      for (const id of ['amBarText', 'amCenterText']) {
        const el = document.getElementById(id);
        if (el.classList.contains('dim')) el.textContent = processingText;
      }
    });
    if (window.notype.onTranscriptionDone) {
      window.notype.onTranscriptionDone((data) => {
        document.body.classList.remove('processing');
        if (data && data.ok) document.body.classList.add('done');
      });
    }
    if (window.notype.onBusy) {
      window.notype.onBusy(() => {
        playBusy();
        document.body.classList.remove('busy');
        void document.body.offsetWidth;  // restart the CSS animation
        document.body.classList.add('busy');
        setTimeout(() => document.body.classList.remove('busy'), 320);
      });
    }
    window.notype.onSetTheme((theme) => {
      document.body.classList.toggle('dark', theme === 'dark');
    });
    if (window.notype.onSetStyle) {
      window.notype.onSetStyle((style) => {
        const valid = ['wave_classic', 'wave', 'aurora', 'particles', 'pulse', 'ribbon', 'spectrum',
                       'amoled_top', 'amoled_bottom', 'amoled_center'];
        currentStyle = valid.includes(style) ? style : 'wave';
        document.body.dataset.style = currentStyle;
        // canvases need a re-measure when switched in (element was display:none)
        if (currentStyle === 'particles') setTimeout(resizeParticlesCanvas, 50);
        if (currentStyle.startsWith('amoled')) {
          setTimeout(() => { sizeAmoledCanvas(amBarCanvas); sizeAmoledCanvas(amCenterCanvas); }, 50);
        }
      });
    }
    if (window.notype.onPreviewEnabled) {
      window.notype.onPreviewEnabled((enabled) => {
        document.body.classList.toggle('with-preview', !!enabled);
      });
    }
    if (window.notype.onAppLang) {
      window.notype.onAppLang((lang) => {
        listenText = lang === 'en' ? 'Listening…' : 'Ich höre zu…';
        processingText = lang === 'en' ? 'Processing…' : 'Verarbeite…';
        for (const id of ['amBarText', 'amCenterText']) {
          const el = document.getElementById(id);
          if (el.classList.contains('dim')) el.textContent = listenText;
        }
      });
    }
    if (window.notype.onPreviewText) {
      window.notype.onPreviewText((text) => {
        document.getElementById('livePreviewText').textContent = text;
        document.getElementById('livePreview').classList.add('visible');
        for (const id of ['amBarText', 'amCenterText']) {
          const el = document.getElementById(id);
          el.textContent = text;
          el.classList.remove('dim');
        }
      });
    }
  }
</script>
</body>
</html>
