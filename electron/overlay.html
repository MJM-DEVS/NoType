<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoType Overlay</title>
<style>
  /* ═══════════════════════════════════════════════════════════════
     NoType overlay – OLED styles on pure black, plus characters.
       amoled  AMOLED Bar   pill: mirrored spectrum + live text + timer
       matrix  Dot Matrix   LED dot grid: dot-font timer + spectrum
       island  Island       spring-morphing capsule that grows with the text
       halo    Halo         capsule with a luminous, voice-driven color rim
       buddy   Buddy        LED pixel face that talks along + speech bubble
       slime   Slime        jelly blob that wobbles with every syllable
       dragon  Dragon       pixel dragon; its fire breath is the visualizer
       mimic   Mimic        treasure chest whose lid talks along
       sage    Sage         light paper pill, the voice as a calm olive line
     Everything that moves is drawn on small canvases or changes opacity/
     transform only: no CSS blur filters, no backdrop-filter, no per-frame
     box-shadow (transparent always-on-top windows make those expensive and
     have provoked driver TDRs before). Window sizes live in main.js
     (OVERLAY_STYLES) and match the fixed sizes below.
     ═══════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: transparent;
    overflow: hidden;
    color: #fff;
    font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    /* accent tokens (mirrored in ACCENTS for the canvases) */
    --a1: #00d4aa; --a2: #2ee9c6; --a3: #4dd0ff; --glow: 0, 212, 170; --rec: #00d4aa;
  }
  body[data-accent="mono"]   { --a1: #ffffff; --a2: #f2f2f2; --a3: #d4d4d4; --glow: 255, 255, 255; --rec: #ff3b30; }
  body[data-accent="aurora"] { --a1: #ff7a45; --a2: #ff4fb4; --a3: #8f7bff; --glow: 170, 120, 255; --rec: #ff4fb4; }
  body[data-accent="blue"]   { --a1: #0a84ff; --a2: #409cff; --a3: #64d2ff; --glow: 10, 132, 255; --rec: #0a84ff; }
  body[data-accent="violet"] { --a1: #bf5af2; --a2: #a472ff; --a3: #7d7aff; --glow: 191, 90, 242; --rec: #bf5af2; }
  body[data-accent="red"]    { --a1: #ff453a; --a2: #ff5e6c; --a3: #ff8a80; --glow: 255, 69, 58; --rec: #ff453a; }
  body[data-accent="amber"]  { --a1: #ffb340; --a2: #ffa21a; --a3: #ffd60a; --glow: 255, 170, 40; --rec: #ff9f0a; }

  .style { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; }
  body[data-style="amoled"] .s-amoled,
  body[data-style="matrix"] .s-matrix,
  body[data-style="island"] .s-island,
  body[data-style="halo"]   .s-halo,
  body[data-style="buddy"]  .s-buddy,
  body[data-style="slime"]  .s-slime,
  body[data-style="dragon"] .s-dragon,
  body[data-style="mimic"]  .s-mimic,
  body[data-style="sage"]   .s-sage { display: flex; }

  /* Every shape enters with a short spring and leaves with a quick fade;
     main.js sends 'overlay-leaving' ~220 ms before it hides the window. */
  .shape { will-change: transform, opacity; }
  body.leaving .shape { animation: leaveOut 0.2s cubic-bezier(0.4, 0, 1, 1) forwards !important; }
  @keyframes leaveOut { to { opacity: 0; transform: scale(0.94); } }
  /* Esc: the take is thrown away. The shape folds shut instead of the usual
     fade, so a cancel never reads like a finished dictation. */
  body.leaving.cancelled .shape { animation: cancelOut 0.2s cubic-bezier(0.55, 0, 0.8, 0.2) forwards !important; }
  @keyframes cancelOut { to { opacity: 0; transform: scale(0.72, 0.18); filter: blur(2px); } }
  /* On the section, not the shape – swapping the shape's animation would
     replay its entry once the nudge ends. */
  body.busy .style { animation: nudge 0.3s ease; }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); } 55% { transform: translateX(4px); } 80% { transform: translateX(-2px); }
  }
  @keyframes springIn {
    0%   { opacity: 0; transform: scale(0.82, 0.62); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1, 1); }
  }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.55); }
    60%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Shared text line: newest words stay visible, older ones slide out
     to the left behind a soft fade (rtl container + ltr span). ── */
  .txt {
    min-width: 0; overflow: hidden; white-space: nowrap;
    direction: rtl; text-align: left;
    font-size: 14px; line-height: 1.3; letter-spacing: 0.005em;
  }
  .txt > span { direction: ltr; unicode-bidi: embed; color: rgba(255, 255, 255, 0.95); }
  .txt.clip { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 40px); }
  .txt > span.dim { color: rgba(255, 255, 255, 0.46); }
  /* Status placeholder ("Ich höre zu…") gets a slow light sweep. */
  .txt > span.shimmer {
    color: transparent;
    background: linear-gradient(90deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.34) 35%,
                rgba(255,255,255,0.92) 50%, rgba(255,255,255,0.34) 65%, rgba(255,255,255,0.34) 100%);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text;
    animation: shimmer 2.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  body.processing-dim .txt > span:not(.dim):not(.shimmer) { color: rgba(255, 255, 255, 0.55); transition: color 0.3s; }

  .time {
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    color: rgba(255, 255, 255, 0.42);
  }

  /* ═══ 1. AMOLED BAR  (window 708×92) ═══════════════════════════ */
  .am-pill {
    position: relative; width: 680px; height: 64px; border-radius: 32px;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.085),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
    display: flex; align-items: center; gap: 16px; padding: 0 24px 0 20px;
    animation: springIn 0.46s cubic-bezier(0.2, 1.3, 0.35, 1) both;
  }
  /* Static glow + accent hairline, faded by voice energy (opacity only). */
  .am-glow {
    position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    will-change: opacity;
    box-shadow: 0 0 13px rgba(var(--glow), 0.38), inset 0 0 0 1px rgba(var(--glow), 0.6);
  }
  .am-viz { width: 136px; height: 36px; flex: 0 0 auto; }
  .am-sep { width: 1px; height: 26px; background: rgba(255, 255, 255, 0.08); flex: 0 0 auto; }
  .am-pill .txt { flex: 1 1 auto; font-size: 14.5px; }
  .am-pill .time { flex: 0 0 auto; }

  /* ═══ 2. DOT MATRIX  (window 708×104) ══════════════════════════ */
  .mx-card {
    position: relative; width: 680px; height: 76px; border-radius: 24px;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.085);
    display: flex; align-items: center; gap: 20px; padding: 0 26px 0 22px;
    animation: fadeUp 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .mx-grid { width: 242px; height: 39px; flex: 0 0 auto; }
  .mx-sep { width: 1px; height: 40px; background: rgba(255, 255, 255, 0.08); flex: 0 0 auto; }
  .mx-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .mx-head {
    display: flex; align-items: center; gap: 8px;
    font: 600 10.5px/1 'Cascadia Mono', 'Cascadia Code', Consolas, monospace;
    letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255, 255, 255, 0.5);
  }
  .mx-rec {
    width: 7px; height: 7px; border-radius: 50%; background: var(--rec); flex: 0 0 auto;
    animation: recPulse 1.3s ease-in-out infinite;
  }
  @keyframes recPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.28; } }
  body[data-state="processing"] .mx-rec { background: #fff; animation-duration: 0.5s; }
  body[data-state="done"] .mx-rec { background: var(--a1); animation: none; }
  .mx-body .txt { font-size: 14.5px; }

  /* ═══ 3. ISLAND  (window 648×116) ═══════════════════════════════
     The shape's size is spring-animated from JS; children are pinned to
     its edges so they ride along like on a real dynamic island. */
  .s-island { padding: 18px 24px; }
  body[data-pos="top"]    .s-island { align-items: flex-start; }
  body[data-pos="bottom"] .s-island { align-items: flex-end; }
  .is-shape {
    position: relative; width: 40px; height: 40px; border-radius: 20px;
    background: #000; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.075);
  }
  .is-glyph { position: absolute; left: 13px; top: 50%; width: 30px; height: 22px; transform: translateY(-50%); }
  .is-time {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    color: var(--a1); font-size: 13px;
  }
  .is-text {
    position: absolute; left: 56px; right: 68px; top: 50%; transform: translateY(-50%);
    max-height: 38px; overflow: hidden; opacity: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    font-size: 14.5px; line-height: 19px; color: rgba(255, 255, 255, 0.95);
  }
  .is-text.clip { -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 12px); }
  /* single-line target: don't re-wrap while the shape is still growing */
  .is-text.one { white-space: nowrap; }
  .is-text > span.dim { color: rgba(255, 255, 255, 0.46); }
  body.processing-dim .is-text > span:not(.dim) { color: rgba(255, 255, 255, 0.55); transition: color 0.3s; }

  /* ═══ 4. HALO  (window 616×118) ═════════════════════════════════ */
  .ha-rim { position: absolute; left: 0; top: 0; width: 616px; height: 118px; }
  .s-halo .shape { position: relative; width: 616px; height: 118px; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .ha-body {
    position: absolute; left: 28px; top: 30px; width: 560px; height: 58px;
    display: flex; align-items: center; justify-content: center; padding: 0 30px;
  }
  .ha-body .txt { width: 100%; text-align: center; font-size: 15px; }
  .ha-body .txt.clip { text-align: left; }

  /* ═══ 5. BUDDY  (window 652×108) ═════════════════════════════════
     Same LED dots as the Dot Matrix, arranged as a little face; the live
     text sits in a speech bubble whose tail points at it. */
  .s-buddy { gap: 14px; }
  .bd-face {
    width: 90px; height: 80px; border-radius: 26px; flex: 0 0 auto;
    background: #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.085);
    display: flex; align-items: center; justify-content: center;
    animation: popIn 0.46s cubic-bezier(0.2, 1.25, 0.35, 1) both;
  }
  .bd-cv { width: 72px; height: 61px; }
  /* Speech bubble shared by every character style. */
  .bubble {
    position: relative; width: 500px; height: 50px; border-radius: 25px;
    background: #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.085);
    display: flex; align-items: center; gap: 14px; padding: 0 20px 0 22px;
    animation: fadeUp 0.36s 0.08s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  /* tail: a rotated square whose two outer edges carry the hairline */
  .bubble::before {
    content: ''; position: absolute; left: -6px; top: 50%; width: 13px; height: 13px;
    background: #000; transform: translateY(-50%) rotate(45deg);
    box-shadow: inset 1px -1px 0 rgba(255, 255, 255, 0.085);
  }
  .bubble .txt { flex: 1 1 auto; font-size: 14.5px; }
  .bubble .time { flex: 0 0 auto; }

  /* ═══ 6–8. SLIME · DRAGON · MIMIC ═════════════════════════════════
     The figure stands free on the desktop (no plate), feet on a shared
     baseline, next to the speech bubble. Pixel-art canvases size
     themselves in JS so every art pixel is whole device pixels; the CSS
     sizes below are the 100 % values (identical at 125/150/175/200 %). */
  .ch-row { display: flex; align-items: flex-end; }
  .ch-fig { display: block; flex: 0 0 auto; }
  .s-slime .ch-row { gap: 6px; }
  #slCv { width: 104px; height: 92px; }
  .s-slime .bubble { margin-bottom: 20px; }
  /* dragon: the bubble tucks under the canvas so the fire licks into it */
  #drCv { width: 136px; height: 80px; position: relative; z-index: 1; animation: popIn 0.46s cubic-bezier(0.2, 1.25, 0.35, 1) both; }
  .s-dragon .bubble { width: 476px; margin-left: -28px; margin-bottom: 14px; padding-left: 40px; }
  .s-dragon .bubble::before { display: none; }
  .s-mimic .ch-row { gap: 8px; }
  #mmCv { width: 128px; height: 96px; }
  .s-mimic .bubble { margin-bottom: 22px; }

  /* ═══ 9. SAGE  (window 700×96) ════════════════════════════════════
     The one light style: warm paper instead of OLED black, the voice as a
     calm olive line with a sage echo. It has its own palette, the accent
     color doesn't apply. The drop shadow is static and stays inside the
     window's 18 px margin. */
  .s-sage { --sg-paper: #f5f2e9; --sg-ink: 43, 49, 35; --sg-muted: #646b55; }
  .sg-pill {
    position: relative; width: 660px; height: 60px; border-radius: 30px;
    background: var(--sg-paper);
    box-shadow: 0 0 0 1px rgba(70, 82, 48, 0.16),
                0 6px 16px -6px rgba(32, 36, 24, 0.34), 0 1px 3px rgba(32, 36, 24, 0.12);
    display: flex; align-items: center; gap: 14px; padding: 0 24px 0 20px;
    animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .sg-line { width: 128px; height: 32px; flex: 0 0 auto; }
  .sg-sep { width: 1px; height: 24px; background: rgba(70, 82, 48, 0.16); flex: 0 0 auto; }
  .sg-pill .txt { flex: 1 1 auto; font-size: 14.5px; }
  .sg-pill .txt > span { color: rgb(var(--sg-ink)); }
  .sg-pill .txt > span.dim { color: rgba(var(--sg-ink), 0.5); }
  .sg-pill .txt > span.shimmer {
    color: transparent;
    background-image: linear-gradient(90deg, rgba(var(--sg-ink), 0.4) 0%, rgba(var(--sg-ink), 0.4) 35%,
                      rgba(var(--sg-ink), 0.9) 50%, rgba(var(--sg-ink), 0.4) 65%, rgba(var(--sg-ink), 0.4) 100%);
  }
  body.processing-dim .sg-pill .txt > span:not(.dim):not(.shimmer) { color: rgba(var(--sg-ink), 0.6); }
  .sg-pill .time { flex: 0 0 auto; color: var(--sg-muted); }

  /* ═══ AI CONTEXT CHIPS ════════════════════════════════════════════
     What goes along with the dictation (screenshot, image, copied text).
     main.js makes the window 40 px taller for them: the strip sits above
     the shape, below it when the overlay is at the top of the screen. The
     settings preview (demo) has no strip. */
  body.strip:not([data-pos="top"]) .style { top: 40px; }
  body.strip[data-pos="top"] .style { bottom: 40px; }
  .chips {
    position: fixed; left: 0; right: 0; top: 0; height: 40px; z-index: 2;
    display: none; align-items: flex-end; justify-content: center; gap: 6px;
    padding: 0 24px 2px;
    /* --chip-pull: how far the chips move toward the shape, so they sit
       about 10 px from its edge whatever empty margin the style has
       (the Island sets it per frame while it grows). */
    transform: translateY(var(--chip-pull, 0px));
  }
  body[data-style="amoled"], body[data-style="matrix"], body[data-style="buddy"] { --chip-pull: 6px; }
  body[data-style="halo"] { --chip-pull: 18px; }   /* the rim glow needs a little room */
  body[data-style="slime"], body[data-style="dragon"], body[data-style="mimic"] { --chip-pull: 2px; }
  body[data-style="sage"] { --chip-pull: 10px; }
  body.strip .chips { display: flex; }
  body[data-pos="top"] .chips {
    top: auto; bottom: 0; align-items: flex-start; padding: 2px 24px 0;
    transform: translateY(calc(-1 * var(--chip-pull, 0px)));
  }
  .chip {
    flex: 0 1 auto; min-width: 0; max-width: 210px; height: 30px; border-radius: 15px;
    display: flex; align-items: center; gap: 7px; padding: 0 13px 0 4px;
    background: #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.11);
    font-size: 12.5px; line-height: 1; white-space: nowrap; color: rgba(255, 255, 255, 0.9);
    transform-origin: 50% 100%;
    animation: popIn 0.42s cubic-bezier(0.2, 1.25, 0.35, 1) both;
  }
  body[data-pos="top"] .chip { transform-origin: 50% 0; }
  /* image chips keep their label; long text previews give way first */
  .chip.img { flex-shrink: 0; }
  /* a small card, not a stadium: fully rounded it read like a switch */
  .chip-thumb {
    height: 22px; width: auto; max-width: 36px; min-width: 22px; flex: 0 0 auto;
    border-radius: 6px; object-fit: cover;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
  }
  .chip-ico {
    width: 22px; height: 22px; border-radius: 11px; flex: 0 0 auto;
    display: grid; place-items: center; background: rgba(var(--glow), 0.16);
  }
  .chip-ico svg { width: 12px; height: 12px; fill: none; stroke: var(--a1); stroke-width: 1.6; stroke-linecap: round; }
  .chip-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chip-sub { flex: 0 0 auto; color: rgba(255, 255, 255, 0.5); font-variant-numeric: tabular-nums; }
  /* Sage: paper chips to match the pill */
  body[data-style="sage"] .chip {
    background: #f5f2e9; color: #2b3123;
    box-shadow: 0 0 0 1px rgba(70, 82, 48, 0.16), 0 3px 8px -3px rgba(32, 36, 24, 0.3);
  }
  body[data-style="sage"] .chip-thumb { box-shadow: 0 0 0 1px rgba(70, 82, 48, 0.2); }
  body[data-style="sage"] .chip-ico { background: rgba(147, 171, 120, 0.3); }
  body[data-style="sage"] .chip-ico svg { stroke: #56663a; }
  body[data-style="sage"] .chip-sub { color: #646b55; }
  body.leaving .chip { animation: leaveOut 0.2s cubic-bezier(0.4, 0, 1, 1) forwards !important; }
  body.leaving.cancelled .chip { animation: cancelOut 0.2s cubic-bezier(0.55, 0, 0.8, 0.2) forwards !important; }
</style>
</head>
<body data-style="amoled" data-accent="mint" data-pos="bottom" data-state="idle">

  <!-- AI context: what goes along with the dictation -->
  <div class="chips" id="chips"></div>

  <!-- 1. AMOLED BAR -->
  <section class="style s-amoled">
    <div class="am-pill shape">
      <div class="am-glow" id="amGlow"></div>
      <canvas class="am-viz" id="amViz"></canvas>
      <div class="am-sep"></div>
      <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
      <div class="time" data-timer="mss">0:00</div>
    </div>
  </section>

  <!-- 2. DOT MATRIX -->
  <section class="style s-matrix">
    <div class="mx-card shape">
      <canvas class="mx-grid" id="mxGrid"></canvas>
      <div class="mx-sep"></div>
      <div class="mx-body">
        <div class="mx-head"><i class="mx-rec"></i><span id="mxLabel">Aufnahme</span></div>
        <div class="txt" data-line="1"><span class="dim">Ich höre zu…</span></div>
      </div>
    </div>
  </section>

  <!-- 3. ISLAND -->
  <section class="style s-island">
    <div class="is-shape shape" id="isShape">
      <canvas class="is-glyph" id="isGlyph"></canvas>
      <div class="is-text" id="isText"><span class="dim"></span></div>
      <div class="is-time time" data-timer="mss">0:00</div>
    </div>
  </section>

  <!-- 4. HALO -->
  <section class="style s-halo">
    <div class="shape">
      <canvas class="ha-rim" id="haRim"></canvas>
      <div class="ha-body"><div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div></div>
    </div>
  </section>

  <!-- 5. BUDDY -->
  <section class="style s-buddy">
    <div class="bd-face shape"><canvas class="bd-cv" id="bdFace"></canvas></div>
    <div class="bubble shape">
      <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
      <div class="time" data-timer="mss">0:00</div>
    </div>
  </section>

  <!-- 6. SLIME -->
  <section class="style s-slime">
    <div class="ch-row">
      <canvas class="ch-fig shape" id="slCv"></canvas>
      <div class="bubble shape">
        <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
        <div class="time" data-timer="mss">0:00</div>
      </div>
    </div>
  </section>

  <!-- 7. DRAGON -->
  <section class="style s-dragon">
    <div class="ch-row">
      <canvas class="ch-fig shape" id="drCv"></canvas>
      <div class="bubble shape">
        <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
        <div class="time" data-timer="mss">0:00</div>
      </div>
    </div>
  </section>

  <!-- 8. MIMIC -->
  <section class="style s-mimic">
    <div class="ch-row">
      <canvas class="ch-fig shape" id="mmCv"></canvas>
      <div class="bubble shape">
        <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
        <div class="time" data-timer="mss">0:00</div>
      </div>
    </div>
  </section>

  <!-- 9. SAGE -->
  <section class="style s-sage">
    <div class="sg-pill shape">
      <canvas class="sg-line" id="sgLine"></canvas>
      <div class="sg-sep"></div>
      <div class="txt" data-line="1"><span class="shimmer">Ich höre zu…</span></div>
      <div class="time" data-timer="mss">0:00</div>
    </div>
  </section>

<script src="sprites.js"></script>
<script>
'use strict';

// ── Setup ─────────────────────────────────────────────────────────
// Without the preload bridge (settings preview iframe) or with ?demo the
// overlay runs a self-contained loop with synthetic speech.
const DEMO = !window.notype || new URLSearchParams(location.search).has('demo');
const NB = 20;   // spectrum bands (matches audio_recorder.N_BANDS)
const STYLES = ['amoled', 'matrix', 'island', 'halo', 'buddy', 'slime', 'dragon', 'mimic', 'sage'];
// Ids of styles that no longer exist → their closest successor.
const LEGACY_STYLES = {
  wave: 'amoled', wave_classic: 'amoled', ribbon: 'amoled', particles: 'amoled', spectrum: 'amoled',
  aurora: 'halo', pulse: 'halo', orb: 'halo',
  amoled_card: 'amoled', amoled_top: 'amoled', amoled_bottom: 'amoled', amoled_center: 'amoled',
};
const ACCENTS = {
  mint:   { bar: ['#00d4aa', '#2ee9c6', '#4dd0ff'], ring: ['#00e0b0', '#36c9ff', '#7f7bff', '#2ee9c6'], glow: '0,212,170',   hi: '#b6fff0' },
  mono:   { bar: ['#ffffff', '#f2f2f2', '#d4d4d4'], ring: ['#ffffff', '#8a8a8a', '#ffffff', '#5a5a5a'], glow: '255,255,255', hi: '#ffffff' },
  aurora: { bar: ['#ff7a45', '#ff4fb4', '#8f7bff', '#3fd0ff'], ring: ['#ff7a45', '#ff4fb4', '#8f7bff', '#3fd0ff'], glow: '170,120,255', hi: '#ffe1f3' },
  blue:   { bar: ['#0a84ff', '#409cff', '#64d2ff'], ring: ['#0a84ff', '#5e5ce6', '#64d2ff', '#0a84ff'], glow: '10,132,255',  hi: '#cfe6ff' },
  violet: { bar: ['#bf5af2', '#a472ff', '#7d7aff'], ring: ['#bf5af2', '#ff4f8b', '#5e5ce6', '#bf5af2'], glow: '191,90,242',  hi: '#f0d9ff' },
  red:    { bar: ['#ff453a', '#ff5e6c', '#ff8a80'], ring: ['#ff453a', '#ff9f0a', '#ff375f', '#ff453a'], glow: '255,69,58',   hi: '#ffd9d6' },
  amber:  { bar: ['#ffb340', '#ffa21a', '#ffd60a'], ring: ['#ff9f0a', '#ff6a3d', '#ffd60a', '#ff9f0a'], glow: '255,170,40',  hi: '#fff0cc' },
};
const I18N = {
  de: { listen: 'Ich höre zu…', proc: 'Verarbeite…', done: 'Eingefügt', rec: 'Aufnahme', procL: 'Verarbeite', doneL: 'Eingefügt' },
  en: { listen: 'Listening…',   proc: 'Processing…', done: 'Inserted',  rec: 'Recording', procL: 'Processing', doneL: 'Inserted' },
};
// Command mode (second hotkey): the spoken words are an instruction for the
// selected text, not dictation.
const I18N_CMD = {
  de: { listen: 'Befehl sprechen…', proc: 'KI schreibt um…', done: 'Fertig', rec: 'Befehl', procL: 'KI', doneL: 'Fertig' },
  en: { listen: 'Speak a command…', proc: 'AI rewriting…',   done: 'Done',   rec: 'Command', procL: 'AI', doneL: 'Done' },
};

const S = {
  style: 'amoled', accent: 'mint', pos: 'bottom', lang: 'de', sounds: true, preview: true,
  state: 'idle', stateAt: 0, recAt: 0, recEnd: 0,
  text: '', hasText: false, leaving: false, command: false,
};
const $ = (id) => document.getElementById(id);
const L = () => (S.command ? I18N_CMD : I18N)[S.lang] || (S.command ? I18N_CMD : I18N).de;
const ACC = () => ACCENTS[S.accent] || ACCENTS.mint;
const now = () => performance.now();
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const ease = (x) => 1 - Math.pow(1 - clamp01(x), 3);

// ── Audio model ───────────────────────────────────────────────────
// Backend sends ~31 frames/s: level 0..1 + NB band levels 0..1. The
// renderer smooths them (fast attack, slower release) at display rate.
const bandsIn = new Float32Array(NB), bandsSm = new Float32Array(NB);
let levelIn = 0, levelSm = 0, haveBands = false;

function onAudio(val, bands) {
  levelIn = clamp01(+val || 0);
  if (bands && bands.length) {
    haveBands = true;
    const n = bands.length;
    for (let i = 0; i < NB; i++) {
      const x = (i / (NB - 1)) * (n - 1), i0 = Math.floor(x), f = x - i0;
      bandsIn[i] = clamp01((+bands[i0] || 0) * (1 - f) + (+bands[Math.min(n - 1, i0 + 1)] || 0) * f);
    }
  }
}

function stepAudio(dt, t) {
  const live = S.state === 'listening';
  for (let i = 0; i < NB; i++) {
    // Old backend (level only): shape a plausible voice spectrum from it.
    const target = !live ? 0 : haveBands ? bandsIn[i]
      : levelIn * 1.6 * (0.55 + 0.45 * Math.sin(t * 7.3 + i * 0.9)) * Math.exp(-((i - 6) ** 2) / 40);
    const tau = target > bandsSm[i] ? 0.035 : 0.15;
    bandsSm[i] += (target - bandsSm[i]) * (1 - Math.exp(-dt / tau));
  }
  const lt = live ? levelIn : 0;
  levelSm += (lt - levelSm) * (1 - Math.exp(-dt / (lt > levelSm ? 0.05 : 0.22)));
}

// Continuous spectrum lookup over the voice range. x: 0 (≈100 Hz) … 1 (≈5 kHz).
function band(x) {
  const p = 1 + clamp01(x) * 15, i0 = Math.floor(p), f = p - i0;
  return bandsSm[i0] * (1 - f) + bandsSm[Math.min(NB - 1, i0 + 1)] * f;
}
// Overall voice energy 0..1 – what the glows and blobs key off.
function energy() {
  let s = 0;
  for (let i = 2; i < 14; i++) s += bandsSm[i];
  return clamp01(s / 12 * 1.5 + levelSm * 0.6);
}

// ── State blends ──────────────────────────────────────────────────
// Each renderer cross-fades between listening/processing/done with these
// 0..1 values instead of snapping.
const mix = { processing: 0, done: 0 };
function stepMix(dt) {
  const k = 1 - Math.exp(-dt / 0.12);
  mix.processing += ((S.state === 'processing' ? 1 : 0) - mix.processing) * k;
  mix.done += ((S.state === 'done' ? 1 : 0) - mix.done) * k;
}
const sinceState = () => (now() - S.stateAt) / 1000;

// ── Canvas helpers ────────────────────────────────────────────────
function prep(cv) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;          // layout size – ignores entry transforms
  const bw = Math.round(w * d), bh = Math.round(h * d);
  if (bw && bh && (cv.width !== bw || cv.height !== bh)) { cv.width = bw; cv.height = bh; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return [ctx, w, h];
}
function lineGrad(ctx, x0, x1, colors) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  colors.forEach((c, i) => g.addColorStop(i / (colors.length - 1), c));
  return g;
}
// Animated checkmark centred at (cx, cy), p = draw progress 0..1.
function drawCheck(ctx, cx, cy, s, p, color, width) {
  if (p <= 0) return;
  const pts = [[-0.62, 0.02], [-0.18, 0.46], [0.66, -0.42]];
  const l1 = Math.hypot(0.44, 0.44), l2 = Math.hypot(0.84, 0.88), total = l1 + l2;
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = width || 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + pts[0][0] * s, cy + pts[0][1] * s);
  const d = p * total;
  if (d <= l1) {
    const f = d / l1;
    ctx.lineTo(cx + (pts[0][0] + (pts[1][0] - pts[0][0]) * f) * s, cy + (pts[0][1] + (pts[1][1] - pts[0][1]) * f) * s);
  } else {
    const f = (d - l1) / l2;
    ctx.lineTo(cx + pts[1][0] * s, cy + pts[1][1] * s);
    ctx.lineTo(cx + (pts[1][0] + (pts[2][0] - pts[1][0]) * f) * s, cy + (pts[1][1] + (pts[2][1] - pts[1][1]) * f) * s);
  }
  ctx.stroke();
  ctx.restore();
}
const doneProgress = () => (S.state === 'done' ? ease(sinceState() / 0.36) : 0);

// ── Character helpers (Buddy, Slime, Dragon, Mimic) ───────────────
const hexRGB = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function mixHex(a, b, f) {
  const x = hexRGB(a), y = hexRGB(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * f).toString(16).padStart(2, '0')).join('');
}
// Lip sync: a fast envelope of the raw input with auto-gain, so mouths open
// and close per syllable at any mic level. o: 0..1, onset: a syllable
// started this frame.
const LIP = { env: 0, peak: 0, o: 0, onset: false, talkUntil: 0 };
function stepLip(dt) {
  let raw = levelIn;
  if (haveBands) { raw = 0; for (let i = 2; i < 14; i++) raw += bandsIn[i]; raw /= 12; }
  if (S.state !== 'listening') raw = 0;
  LIP.env += (raw - LIP.env) * (1 - Math.exp(-dt / (raw > LIP.env ? 0.03 : 0.09)));
  LIP.peak = Math.max(LIP.env, LIP.peak * Math.exp(-dt / 1.5), 0.08);
  const o = LIP.env / LIP.peak;
  LIP.onset = o > 0.55 && LIP.o <= 0.55;
  LIP.o = o;
  if (o > 0.3) LIP.talkUntil = now() + 450;
}
const talking = () => now() < LIP.talkUntil;
// Each character blinks on its own clock: ~130 ms every 2.2–5.6 s.
function blinker() {
  let at = 0;
  return () => {
    const ms = now();
    if (!at || ms > at + 130) at = ms + 2200 + Math.random() * 3400;
    return ms >= at;
  };
}

// Pixel art: a character paints into a tiny canvas, one canvas pixel per
// art pixel, which is then scaled up without smoothing. An art pixel is PX
// css px rounded to whole device pixels, so edges stay crisp at any scale.
const PX = 4;
function pixLayer(cols, rows) {
  const c = document.createElement('canvas');
  c.width = cols; c.height = rows;
  return { c, x: c.getContext('2d'), cache: new Map(), palKey: '', pal: null };
}
function pixPalette(L, key, build) {
  if (L.palKey !== key) { L.palKey = key; L.pal = build(); L.cache.clear(); }
  return L.pal;
}
// Sprite rows (see sprites.js) → canvas, cached until the palette changes.
function pixSprite(L, rows) {
  let s = L.cache.get(rows);
  if (s) return s;
  s = document.createElement('canvas');
  s.width = rows[0].length; s.height = rows.length;
  const x = s.getContext('2d');
  rows.forEach((row, r) => {
    for (let k = 0; k < row.length; k++) {
      const col = L.pal[row[k]];
      if (col) { x.fillStyle = col; x.fillRect(k, r, 1, 1); }
    }
  });
  L.cache.set(rows, s);
  return s;
}
function pixDraw(L, rows, x, y) { L.x.drawImage(pixSprite(L, rows), x, y); }
function pixRect(L, x, y, w, h, color) { L.x.fillStyle = color; L.x.fillRect(x, y, w, h); }
function pixBlit(cv, L) {
  const d = window.devicePixelRatio || 1, pd = Math.max(1, Math.round(PX * d));
  const bw = L.c.width * pd, bh = L.c.height * pd;
  if (cv.width !== bw || cv.height !== bh) {
    cv.width = bw; cv.height = bh;
    cv.style.width = bw / d + 'px'; cv.style.height = bh / d + 'px';
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, bw, bh);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(L.c, 0, 0, bw, bh);
}
// Particles in art pixels: {x, y, vx, vy, age, life, ...}; returns the live ones.
function stepParticles(list, dt, gravity, drag) {
  let n = 0;
  for (const p of list) {
    p.age += dt;
    if (p.age >= p.life) continue;
    if (p.age < 0) { list[n++] = p; continue; }     // delayed start
    p.vy += gravity * dt;
    if (drag) { const k = Math.exp(-drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    list[n++] = p;
  }
  list.length = n;
}

// ═══ 1. AMOLED BAR ════════════════════════════════════════════════
function renderAmoled(dt, t) {
  const [ctx, W, H] = prep($('amViz'));
  const pal = ACC().bar, ps = mix.processing, ds = mix.done;
  const N = 21, gap = W / N, bw = Math.max(2.6, gap * 0.5), mid = H / 2, c = (N - 1) / 2;
  ctx.fillStyle = lineGrad(ctx, 0, W, pal);
  for (let j = 0; j < N; j++) {
    const d = Math.abs(j - c) / c;                              // 0 centre … 1 edge
    const v = Math.pow(band(d * 0.92), 0.8) * (1 - 0.32 * d * d); // lows centre, highs outward
    let h = bw + (H - bw) * v;
    // processing: dots with a pulse running through them
    const pulse = Math.pow(Math.max(0, Math.sin(t * 5.2 - j * 0.5)), 8);
    h += (bw + (H * 0.46 - bw) * pulse - h) * ps;
    h += (bw - h) * ds;
    // quiet → a slow breathing shimmer so the pill never looks frozen
    const breathe = 0.62 + 0.38 * Math.sin(t * 2.4 - d * 3.2);
    const a = (1 - 0.42 * d) * (v < 0.04 ? breathe : 1);
    ctx.globalAlpha = a * (1 - ds * 0.8);
    const x = (j + 0.5) * gap;
    ctx.beginPath(); ctx.roundRect(x - bw / 2, mid - h / 2, bw, h, bw / 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // done: the dots dim and a check draws itself across the centre
  if (ds > 0.01) {
    ctx.fillStyle = '#000'; ctx.globalAlpha = ds * 0.85;
    ctx.fillRect(W / 2 - 18, 0, 36, H); ctx.globalAlpha = 1;
    drawCheck(ctx, W / 2, mid, 11, doneProgress(), pal[0], 2.6);
  }
  const flash = S.state === 'done' ? Math.max(0.55, 1 - sinceState() * 0.8) : 0;
  $('amGlow').style.opacity = Math.max((0.12 + energy() * 0.88) * (1 - ps * 0.75) * (1 - ds), flash).toFixed(3);
}

// ═══ 2. DOT MATRIX ════════════════════════════════════════════════
// 44 × 7 LED grid at 5.5 px pitch: a 3×5 dot-font timer on the left,
// a mirrored spectrum on the right, unlit dots faintly visible.
const MX = { C: 44, R: 7, P: 5.5, specFrom: 16 };
const MX_FONT = {
  0: ['111', '101', '101', '101', '111'], 1: ['010', '110', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'], 3: ['111', '001', '011', '001', '111'],
  4: ['101', '101', '111', '001', '001'], 5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'], 7: ['111', '001', '010', '010', '010'],
  8: ['111', '101', '111', '101', '111'], 9: ['111', '101', '111', '001', '111'],
  ':': ['0', '1', '0', '1', '0'],
};
const MX_CHECK = ['0000001', '0000010', '1000100', '0101000', '0010000'];
const mxLit = new Float32Array(MX.C * MX.R);    // 0 unlit … 1 lit (white)
const mxAcc = new Uint8Array(MX.C * MX.R);      // 1 → accent colour

function mxTimerDots(str) {
  let col = 0;
  for (const ch of str) {
    const g = MX_FONT[ch];
    if (!g) continue;
    for (let r = 0; r < 5; r++) for (let k = 0; k < g[r].length; k++) {
      if (g[r][k] === '1' && col + k < MX.specFrom - 2) mxLit[(r + 1) * MX.C + col + k] = 0.92;
    }
    col += g[0].length + 1;
  }
}

function renderMatrix(dt, t) {
  const [ctx, W, H] = prep($('mxGrid'));
  const { C, R, P, specFrom } = MX, ps = mix.processing;
  mxLit.fill(0); mxAcc.fill(0);
  mxTimerDots(timerText('mss'));
  const SC = C - specFrom, mid = (R - 1) / 2;
  if (S.state === 'done') {
    const p = ease(sinceState() / 0.4), c0 = specFrom + Math.floor((SC - 7) / 2);
    for (let r = 0; r < 5; r++) for (let k = 0; k < 7; k++) {
      if (MX_CHECK[r][k] === '1' && k / 7 <= p) { mxLit[(r + 1) * C + c0 + k] = 1; mxAcc[(r + 1) * C + c0 + k] = 1; }
    }
  } else {
    for (let k = 0; k < SC; k++) {
      const d = Math.abs(k - (SC - 1) / 2) / ((SC - 1) / 2);
      const v = Math.pow(band(d * 0.9), 0.75) * (1 - 0.25 * d * d);
      const reach = v * (mid + 0.7);                          // rows lit above/below centre
      for (let r = 0; r < R; r++) {
        const dist = Math.abs(r - mid);
        // centre row idles as a dim baseline and brightens with the voice
        let lit = dist === 0 ? 0.3 + 0.7 * clamp01(reach * 2.5) : clamp01((reach - dist + 0.5) * 1.6);
        // processing: diagonal scan bands sweeping across the grid
        const scan = ((k + r * 0.7 - t * 16) % 11 + 11) % 11;
        const sl = scan < 1.6 ? 1 - scan / 1.6 : 0;
        lit = lit * (1 - ps) + sl * ps;
        const idx = r * C + specFrom + k;
        mxLit[idx] = lit;
        if (lit > 0.5 && dist >= reach - 0.6 && reach > 1.2 && ps < 0.5) mxAcc[idx] = 1; // peak dots
      }
    }
  }
  // boot-up: the grid switches on column by column after a recording starts
  const boot = S.state === 'listening' ? clamp01((now() - S.recAt) / 360) : 1;
  const acc = ACC().bar[0];
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      if (c / C > boot) continue;
      const idx = r * C + c, v = mxLit[idx];
      const x = (c + 0.5) * P, y = (r + 0.5) * (H / R);
      ctx.beginPath();
      ctx.arc(x, y, v > 0.05 ? 1.45 : 1.2, 0, Math.PI * 2);
      if (v > 0.05) {
        ctx.fillStyle = mxAcc[idx] ? acc : '#ffffff';
        ctx.globalAlpha = 0.25 + 0.75 * v;
      } else {
        ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.1;
      }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ═══ 3. ISLAND ═══════════════════════════════════════════════════
// Critically-damped-ish springs on width/height; children are pinned to
// the edges. Compact: glyph + timer. With text: grows to fit, max 2 lines.
const IS = { w: 40, h: 40, vw: 0, vh: 0, COMPACT_W: 176, H1: 40, MAX_W: 600, TEXT_MAX: 476 };
const isMeasure = document.createElement('canvas').getContext('2d');
function islandTarget() {
  if (S.state === 'idle' || S.leaving) return [40, 40];
  if (!S.hasText) return [IS.COMPACT_W, IS.H1];
  isMeasure.font = "14.5px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif";
  const tw = isMeasure.measureText(S.text).width;
  if (tw <= IS.TEXT_MAX) return [Math.max(IS.COMPACT_W + 60, 56 + tw + 72), 52];
  return [IS.MAX_W, 72];
}
function renderIsland(dt, t) {
  const [tw, th] = islandTarget();
  const k = 340, c = 2 * Math.sqrt(k) * 0.74;               // slight overshoot = "alive"
  for (let s = dt; s > 0; s -= 1 / 120) {
    const h = Math.min(s, 1 / 120);
    IS.vw += (k * (tw - IS.w) - c * IS.vw) * h; IS.w += IS.vw * h;
    IS.vh += (k * (th - IS.h) - c * IS.vh) * h; IS.h += IS.vh * h;
  }
  const shape = $('isShape');
  shape.style.width = IS.w.toFixed(1) + 'px';
  shape.style.height = IS.h.toFixed(1) + 'px';
  shape.style.borderRadius = Math.min(IS.h / 2, 26).toFixed(1) + 'px';
  // Chips ride along ~10 px from the shape's edge (section: 116 px, 18 px padding).
  const free = S.pos === 'center' ? (116 - IS.h) / 2 : 116 - 18 - IS.h;
  const pull = Math.max(0, free - 8).toFixed(1) + 'px';
  if (pull !== IS.pull) { IS.pull = pull; document.body.style.setProperty('--chip-pull', pull); }
  const open = clamp01((IS.w - IS.COMPACT_W - 30) / 90);
  const isText = $('isText');
  isText.style.opacity = (S.hasText ? open : 0).toFixed(3);
  if (isText.classList.contains('one') !== (th < 60)) isText.classList.toggle('one', th < 60);
  const inner = clamp01((IS.w - 60) / 70);                  // glyph/timer fade in as it opens
  const glyph = $('isGlyph'), time = shape.querySelector('.is-time');
  glyph.style.opacity = inner.toFixed(3);
  time.style.opacity = (inner * (S.state === 'done' ? 0 : 1)).toFixed(3);

  const [ctx, W, H] = prep(glyph);
  const pal = ACC().bar, ps = mix.processing, ds = mix.done, mid = H / 2;
  ctx.fillStyle = lineGrad(ctx, 0, W, pal);
  const N = 5, bw = 3.2, gap = (W - bw) / (N - 1);
  for (let j = 0; j < N; j++) {
    const d = Math.abs(j - 2) / 2;
    const v = Math.pow(band(0.08 + d * 0.5), 0.7);
    let h = bw + (H - bw) * v * (1 - 0.2 * d);
    const hop = Math.pow(Math.max(0, Math.sin(t * 6 - j * 0.9)), 4);  // processing: rolling dots
    h += (bw + (H * 0.5 - bw) * hop - h) * ps;
    ctx.globalAlpha = (v < 0.04 && ps < 0.5 ? 0.55 + 0.35 * Math.sin(t * 2.6 - j * 0.8) : 1) * (1 - ds);
    ctx.beginPath(); ctx.roundRect(j * gap, mid - h / 2, bw, h, bw / 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (ds > 0.01) drawCheck(ctx, W / 2, mid, 9.5, doneProgress(), pal[0], 2.6);
}

// ═══ 4. HALO ═════════════════════════════════════════════════════
// Rim = stacked strokes of a rotating conic gradient (additive), which
// reads as bloom without any blur filter. A second, band-driven gradient
// adds bright spots that dance with the voice.
const HA = { rot: 0, rot2: 0, x: 28, y: 30, w: 560, h: 58 };
const HA_PASSES = [[30, 0.03], [19, 0.055], [11, 0.1], [5, 0.2], [2.2, 0.5]];
function renderHalo(dt, t) {
  const [ctx, W, H] = prep($('haRim'));
  const pal = ACC().ring, e = energy(), ps = mix.processing, ds = mix.done;
  HA.rot += dt * (0.5 + e * 2.4) * (1 - ps * 0.7);
  HA.rot2 -= dt * (0.35 + e * 1.2);
  const cx = W / 2, cy = H / 2;
  const g = ctx.createConicGradient(HA.rot, cx, cy);
  pal.forEach((col, i) => g.addColorStop(i / pal.length, col));
  g.addColorStop(1, pal[0]);
  // voice spots: alpha stops from the spectrum, mirrored around the ring
  const g2 = ctx.createConicGradient(HA.rot2, cx, cy);
  const SP = 16;
  for (let i = 0; i <= SP; i++) {
    const d = Math.abs((i / SP) * 2 - 1);
    g2.addColorStop(i / SP, `rgba(255,255,255,${(Math.pow(band(d * 0.85), 1.1) * 0.95).toFixed(3)})`);
  }
  const flash = S.state === 'done' ? Math.max(0, 1 - sinceState() * 1.6) : 0;
  const I = (0.42 + 0.95 * e) * (1 - 0.65 * ps) + ds * 0.35 + flash * 0.6;
  const path = () => { ctx.beginPath(); ctx.roundRect(HA.x, HA.y, HA.w, HA.h, HA.h / 2); };
  path();
  ctx.globalCompositeOperation = 'lighter';
  for (const [lw, a] of HA_PASSES) {
    ctx.lineWidth = lw * (0.85 + 0.4 * e);
    ctx.strokeStyle = g; ctx.globalAlpha = Math.min(1, a * I); ctx.stroke();
  }
  for (const [lw, a] of [[12, 0.1], [5, 0.24], [2, 0.5]]) {
    ctx.lineWidth = lw; ctx.strokeStyle = g2; ctx.globalAlpha = a * (1 - ps); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fill();
  // light bleeding into the glass: soft falloff, not a second border
  ctx.save(); ctx.clip();
  ctx.strokeStyle = g;
  for (const [lw, a] of [[22, 0.03], [12, 0.045], [5, 0.07]]) {
    ctx.lineWidth = lw; ctx.globalAlpha = a * Math.min(1.4, I); ctx.stroke();
  }
  ctx.restore();
  ctx.lineWidth = 1.4; ctx.strokeStyle = g; ctx.globalAlpha = Math.min(1, 0.5 + 0.5 * I); ctx.stroke();
  // processing: a white comet circling the rim
  if (ps > 0.01) {
    const cg = ctx.createConicGradient(t * 5.5, cx, cy);
    cg.addColorStop(0, 'rgba(255,255,255,0)'); cg.addColorStop(0.78, 'rgba(255,255,255,0)');
    cg.addColorStop(0.97, 'rgba(255,255,255,1)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = cg;
    for (const [lw, a] of [[10, 0.12], [4, 0.35], [1.6, 1]]) { ctx.lineWidth = lw; ctx.globalAlpha = a * ps; ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
}

// ═══ 5. BUDDY ════════════════════════════════════════════════════
// 13 × 11 LED face at the Dot Matrix pitch. The mouth opens with your
// voice, the eyes blink and now and then glance at the bubble; while
// processing it looks up and "thinks" (bouncing dots), when done it grins.
const BD = { C: 13, R: 11, P: 5.5, mouth: 0, mouthAt: 0, blinkAt: 0, glanceAt: 0, glanceEnd: 0 };
// Mouth frames for rows 6-9, columns 3-9: 1 = lip (white), 2 = inside (accent).
const BD_MOUTH = [
  ['1000001', '0111110', '0000000', '0000000'],   // resting smile
  ['0000000', '0111110', '0000000', '0000000'],   // closed, mid-sentence
  ['0011100', '0122210', '0011100', '0000000'],   // small "o"
  ['0111110', '1222221', '0122210', '0011100'],   // open
  ['0111110', '1222221', '1222221', '0111110'],   // wide open
];
const BD_GRIN = ['1111111', '1222221', '0122210', '0011100'];
const BD_HAPPY_EYE = ['010', '101'];
const bdLit = new Float32Array(BD.C * BD.R);
const bdAcc = new Uint8Array(BD.C * BD.R);

function bdDot(c, r, v, acc) {
  if (c < 0 || r < 0 || c >= BD.C || r >= BD.R) return;
  const i = r * BD.C + c;
  if (v >= bdLit[i]) { bdLit[i] = v; bdAcc[i] = acc ? 1 : 0; }
}
function bdGlyph(rows, c0, r0, v) {
  rows.forEach((row, r) => {
    for (let k = 0; k < row.length; k++) {
      if (row[k] !== '0') bdDot(c0 + k, r0 + r, row[k] === '2' ? v * 0.55 : v, row[k] === '2');
    }
  });
}

function renderBuddy(dt, t) {
  const [ctx, W, H] = prep($('bdFace'));
  const { C, R, P } = BD, ms = now();
  bdLit.fill(0); bdAcc.fill(0);
  if (!BD.blinkAt || ms > BD.blinkAt + 130) BD.blinkAt = ms + 2200 + Math.random() * 3400;
  if (ms > BD.glanceEnd) { BD.glanceAt = ms + 3000 + Math.random() * 4000; BD.glanceEnd = BD.glanceAt + 900; }
  const blink = ms >= BD.blinkAt;

  if (S.state === 'done') {
    const p = doneProgress();
    for (const c0 of [2, 8]) bdGlyph(BD_HAPPY_EYE, c0, 2, p);
    bdGlyph(BD_GRIN, 3, 6, p);
    for (const c of [1, 11]) bdDot(c, 5, 0.7 * p, true);          // blush
  } else if (S.state === 'processing') {
    // looking up and to the side, thinking – three dots hop in turn
    for (const c0 of [4, 9]) for (let r = 1; r <= 3; r++) {
      if (!blink || r === 2) { bdDot(c0, r, 0.92); bdDot(c0 + 1, r, 0.92); }
    }
    for (let k = 0; k < 3; k++) {
      const hop = Math.max(0, Math.sin(t * 7 - k * 0.9));
      bdDot(4 + k * 2, hop > 0.55 ? 6 : 7, 0.5 + 0.5 * hop, true);
    }
  } else {
    const glance = ms >= BD.glanceAt && ms < BD.glanceEnd ? 1 : 0;
    for (const c0 of [3, 8]) for (let r = 2; r <= 4; r++) {
      if (!blink || r === 3) { bdDot(c0 + glance, r, 0.92); bdDot(c0 + 1 + glance, r, 0.92); }
    }
    if (S.command) for (const c0 of [3, 8]) { bdDot(c0 + glance, 0, 0.92); bdDot(c0 + 1 + glance, 0, 0.92); }
    const o = LIP.o;
    const m = o > 0.82 ? 4 : o > 0.58 ? 3 : o > 0.32 ? 2 : talking() ? 1 : 0;
    if (m !== BD.mouth && ms - BD.mouthAt > 70) { BD.mouth = m; BD.mouthAt = ms; }
    bdGlyph(BD_MOUTH[BD.mouth], 3, 6, 0.92);
  }

  // boot-up: the face switches on column by column, like the Dot Matrix
  const boot = S.state === 'listening' ? clamp01((ms - S.recAt) / 360) : 1;
  const acc = ACC().bar[0];
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      if (c / C > boot) continue;
      const idx = r * C + c, v = bdLit[idx];
      ctx.beginPath();
      ctx.arc((c + 0.5) * P, (r + 0.5) * (H / R), v > 0.05 ? 1.45 : 1.2, 0, Math.PI * 2);
      if (v > 0.05) {
        ctx.fillStyle = bdAcc[idx] ? acc : '#ffffff';
        ctx.globalAlpha = 0.25 + 0.75 * v;
      } else {
        ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.1;
      }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ═══ 6. SLIME ════════════════════════════════════════════════════
// A jelly blob drawn as a smooth curve. Squash and stretch run on an
// underdamped spring and every syllable kicks a few surface wobble modes,
// so it jiggles along with your voice. Processing: it hops while thinking.
// Done: happy eyes, a big smile and a few sparkles.
const SL = {
  sy: 1, vs: 0, hop: 0, vh: 0, landAt: 0, lean: 0, mouth: 0,
  modes: [{ k: 2, w: 13, a: 0, v: 0, ph: 0 }, { k: 3, w: 18, a: 0, v: 0, ph: 1.3 }, { k: 4, w: 24, a: 0, v: 0, ph: 2.1 }],

  ctx.quadraticCurveTo(x, y, x - s, y); ctx.quadraticCurveTo(x, y, x, y - s);
  ctx.fill();
}
function renderSlime(dt, t) {
  const [ctx, W, H] = prep($('slCv'));
  const acc = ACC(), a1 = acc.bar[0], ms = now();
  if (S.recAt !== SL.recAt) {                       // entry: rises out of a puddle
    SL.recAt = S.recAt; SL.sy = 0.14; SL.vs = 0; SL.hop = SL.vh = 0; SL.sparks.length = 0;
  }
  if (S.state === 'done' && SL.doneAt !== S.stateAt) {
    SL.doneAt = S.stateAt; SL.vh = -170; SL.vs += 3;
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * (0.1 + 0.8 * (i / 5)) + (Math.random() - 0.5) * 0.3;
      SL.sparks.push({ a, d: 44 + Math.random() * 10, age: -i * 0.05, life: 0.7 });
    }
  }
  const voice = S.state === 'listening' ? LIP.o : 0;
  if (LIP.onset) {
    SL.vs += 1.4 + Math.random() * 0.8;
    for (const m of SL.modes) m.v += (Math.random() < 0.5 ? -1 : 1) * m.w * (0.025 + Math.random() * 0.03);
  }
  // hops: thinking hops while processing, one jump of joy when done
  if (S.state === 'processing' && SL.hop === 0 && SL.vh === 0 && ms - SL.landAt > 170) { SL.vh = -140; SL.vs += 2.5; }
  if (SL.hop < 0 || SL.vh < 0) {
    SL.vh += 900 * dt; SL.hop += SL.vh * dt;
    if (SL.hop >= 0) { SL.vs -= Math.min(5, SL.vh * 0.028); SL.hop = SL.vh = 0; SL.landAt = ms; }
  }
  const target = S.leaving ? 0.14 : 1 + 0.1 * voice + (SL.vh < 0 ? 0.08 : 0);
  SL.vs += (-180 * (SL.sy - target) - 7.5 * SL.vs) * dt;
  SL.sy = Math.min(1.6, Math.max(0.08, SL.sy + SL.vs * dt));
  for (const m of SL.modes) {
    m.v += (-m.w * m.w * m.a - 2 * 0.12 * m.w * m.v) * dt;
    m.a = Math.max(-0.1, Math.min(0.1, m.a + m.v * dt));
  }
  SL.lean += ((S.state === 'listening' ? 0.05 + 0.1 * voice : 0.02) - SL.lean) * (1 - Math.exp(-dt / 0.12));
  SL.mouth += (voice - SL.mouth) * (1 - Math.exp(-dt / 0.04));

  // body outline: superellipse, domed on top, flat where it sits
  const sx = Math.min(1.45, Math.max(0.78, 1 / Math.sqrt(SL.sy)));
  const gy = H - 9, cx = W / 2 - 3, w = 34 * sx, h = 48 * SL.sy, top = h * 0.68, bot = h * 0.32;
  const base = gy + SL.hop, cy = base - bot, N = 60, pts = [];
  for (let i = 0; i < N; i++) {
    const th = (i / N) * Math.PI * 2, c = Math.cos(th), s = Math.sin(th), up = s < 0;
    const n = up ? 2.1 : 4;
    const ex = Math.sign(c) * Math.pow(Math.abs(c), 2 / n), ey = Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    let wob = 0;
    for (const m of SL.modes) wob += m.a * Math.sin(m.k * th + m.ph + t * 0.7);
    const r = 1 + wob * (up ? 1 : 0.25);
    const taper = up ? 1 - 0.16 * ey * ey : 1 + 0.06 * ey;   // narrower crown, a foot that spreads
    pts.push([cx + w * ex * r * taper + (up ? SL.lean * top * ey * ey : 0), Math.min(base, cy + (up ? top : bot) * ey * r)]);
  }
  const body = () => {
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const p = pts[i % N], q = pts[(i + 1) % N], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p[0], p[1], mx, my);
    }
    ctx.closePath();
  };

  // ground shadow, smaller while airborne
  const air = clamp01(-SL.hop / 30);
  ctx.fillStyle = `rgba(0,0,0,${(0.3 * (1 - air * 0.6)).toFixed(3)})`;
  ctx.beginPath(); ctx.ellipse(cx, gy + 1.5, w * (0.92 - air * 0.3), 3.2, 0, 0, Math.PI * 2); ctx.fill();

  // jelly: lit from the upper left, slightly see-through
  body();
  const g = ctx.createRadialGradient(cx - w * 0.32, cy - top * 0.5, 2, cx, cy, w * 1.55);
  g.addColorStop(0, mixHex(a1, '#ffffff', 0.62));
  g.addColorStop(0.38, a1);
  g.addColorStop(1, mixHex(a1, '#000000', 0.5));
  ctx.globalAlpha = 0.93; ctx.fillStyle = g; ctx.fill(); ctx.globalAlpha = 1;
  ctx.save();
  ctx.clip();
  // bubbles drifting up inside, faster while it thinks
  const want = S.state === 'processing' ? 7 : 4;
  if (SL.bubbles.length < want && Math.random() < dt * 6) {
    SL.bubbles.push({ x: (Math.random() - 0.5) * 1.1, y: 0, r: 1.2 + Math.random() * 1.8, sp: 0.12 + Math.random() * 0.12 });
  }
  const rise = S.state === 'processing' ? 3.5 : 1;
  SL.bubbles = SL.bubbles.filter((b) => (b.y += b.sp * rise * dt) < 1);
  ctx.strokeStyle = 'rgba(255,255,255,0.32)'; ctx.lineWidth = 1;
  for (const b of SL.bubbles) {
    ctx.beginPath(); ctx.arc(cx + b.x * w * 0.62, base - 4 - b.y * h * 0.9, b.r, 0, Math.PI * 2); ctx.stroke();
  }

  const lx = cx - w * 0.44 + SL.lean * top * 0.4, ly = cy - top * 0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(lx, ly, w * 0.17, top * 0.11 + 1, -0.75, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(lx + w * 0.2, ly - top * 0.2, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  body();
  ctx.lineWidth = 2; ctx.strokeStyle = mixHex(a1, '#000000', 0.62); ctx.stroke();

  // face, fading in once it has risen out of the puddle
  const fa = clamp01((SL.sy - 0.45) / 0.3);
  if (fa > 0) {
    ctx.globalAlpha = fa;
    const fx = cx + 3 + SL.lean * top * 0.35, fy = cy - top * 0.12, ex = w * 0.32;
    const think = S.state === 'processing', done = S.state === 'done';
    ctx.fillStyle = `rgba(255,84,140,${done ? 0.55 : 0.4})`;           // blush
    for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(fx + d * ex * 1.32, fy + 7, 4.2, 2.3, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = SL_INK; ctx.strokeStyle = SL_INK; ctx.lineCap = 'round';
    if (done) {
      ctx.lineWidth = 2.4;
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(fx + d * ex, fy + 1.5, 4, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    } else {
      const blink = SL.blink(), oy = think ? -2.5 : 0;
      for (const d of [-1, 1]) {
        const x0 = fx + d * ex, y0 = fy + oy;
        ctx.fillStyle = SL_INK;
        ctx.beginPath(); ctx.ellipse(x0, y0, 4.4, blink ? 0.9 : 5.8, 0, 0, Math.PI * 2); ctx.fill();
        if (!blink) {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(x0 - 1.3, y0 - (think ? 3 : 2.1), 1.7, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(x0 + 1.5, y0 + 1.8, 0.8, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    // mouth
    const mx = fx, my = fy + 10;
    ctx.fillStyle = SL_INK;
    if (done) {
      ctx.beginPath(); ctx.moveTo(mx - 6.5, my - 1.5); ctx.ellipse(mx, my - 1.5, 6.5, 6, 0, 0, Math.PI); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = '#ff6f8f'; ctx.beginPath(); ctx.ellipse(mx, my + 4.5, 4.2, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (think) {
      ctx.beginPath(); ctx.ellipse(mx + 1, my - 0.5, 1.9, 2.3, 0, 0, Math.PI * 2); ctx.fill();
    } else if (SL.mouth > 0.12) {
      const rx = 2.6 + 3.6 * SL.mouth, ry = 1.6 + 5 * SL.mouth;
      ctx.beginPath(); ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = '#ff6f8f'; ctx.beginPath(); ctx.ellipse(mx, my + ry * 0.75, rx * 0.75, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else {
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mx, my - 3.2, 3.8, Math.PI * 0.22, Math.PI * 0.78); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // sparkles when done: accent star with a white core, readable on any desktop
  SL.sparks = SL.sparks.filter((s) => (s.age += dt) < s.life);
  for (const s of SL.sparks) {
    if (s.age < 0) continue;
    const f = s.age / s.life, sc = Math.sin(f * Math.PI);

    ctx.fillStyle = '#ffffff'; slSparkle(ctx, px, py, 2.4 * sc);
  }
  ctx.globalAlpha = 1;
}

// ═══ 7. DRAGON ═══════════════════════════════════════════════════
// Pixel dragon (sprites.js). It breathes fire while you speak: how far and
// how dense the flames go follows your voice, so the fire is the
// visualizer. Processing: mouth shut, smoke curls from its nostril while it
// looks up. Done: happy eyes, wings beat, a burst of sparks.
const DR = { L: pixLayer(34, 20), fire: [], spawn: 0, open: 0, openAt: 0, flap: 0, smokeAt: 0, recAt: -1, blink: blinker() };
function drFlame(x, y, e) {
  const a = (Math.random() - 0.5) * 0.7, sp = 22 + 26 * e + Math.random() * 8;
  DR.fire.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, age: 0,
    life: 0.34 + 0.24 * e + Math.random() * 0.22, big: Math.random() < 0.55, smoke: false });
}
// Pixel circle outline (midpoint algorithm), for the smoke ring.
function pixRing(L, cx, cy, r, color) {
  let x = r, y = 0, err = 1 - r;
  L.x.fillStyle = color;
  while (x >= y) {
    for (const [dx, dy] of [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]]) L.x.fillRect(cx + dx, cy + dy, 1, 1);
    y++;

  }
}
function renderDragon(dt, t) {
  const SP = NoTypeSprites.dragon, L = DR.L, ms = now(), acc = ACC(), bar = acc.bar;
  const pal = pixPalette(L, S.accent, () => ({
    K: mixHex(bar[0], '#07070c', 0.76), B: bar[0], D: mixHex(bar[0], '#000000', 0.3),
    L: mixHex(bar[0], '#fff3d6', 0.62), H: '#fff1cf', W: mixHex(bar[1], '#000000', 0.16),
    E: '#0b0b12', Q: '#ffffff', N: mixHex(bar[0], '#000000', 0.62),
  }));

  const st = S.state, since = sinceState();
  const bob = st === 'listening' && talking() ? 0 : Math.sin(t * 2.4) > 0.55 ? 1 : 0;
  const mouth = { x: SP.mouth.x, y: SP.mouth.y + bob };

  let m = 0;
  if (st === 'listening') m = LIP.o > 0.72 ? 2 : LIP.o > 0.3 ? 1 : 0;
  else if (st === 'done' && since < 0.3) m = 1;
  if (m !== DR.open && ms - DR.openAt > 70) { DR.open = m; DR.openAt = ms; }
  const o = DR.open;

  // fire while speaking, a spark burst when done, smoke while processing
  if (st === 'listening' && talking()) {
    const e = energy();
    DR.spawn += dt * (30 + 150 * Math.pow(LIP.o, 1.3));
    for (; DR.spawn >= 1; DR.spawn--) drFlame(mouth.x + Math.random(), mouth.y + o * 0.5 + (Math.random() - 0.5) * (1 + o), e);
  }
  const smoky = st === 'processing' || (st === 'listening' && !talking());
  if (smoky && ms > DR.smokeAt) {
    DR.smokeAt = ms + (st === 'processing' ? 260 : 1400 + Math.random() * 1600);
    DR.fire.push({ x: SP.nostril.x + 0.5, y: SP.nostril.y + bob - 0.5, vx: 3 + Math.random() * 3, vy: -5 - Math.random() * 3,
      age: 0, life: 0.9, big: true, smoke: true });
  }
  stepParticles(DR.fire, dt, -6, 0.8);

  const rate = st === 'done' ? (since < 0.7 ? 5.5 : 1.2) : st === 'processing' ? 1.6 : 1 + energy() * 3;
  DR.flap = (DR.flap + dt * rate) % 1;
  const wing = SP.wing[DR.flap < 0.55 ? 0 : 1];

  const x = L.x;
  x.clearRect(0, 0, L.c.width, L.c.height);
  pixDraw(L, wing.rows, wing.at[0], wing.at[1] + bob);
  pixDraw(L, SP.tail.rows, SP.tail.at[0], SP.tail.at[1]);
  pixDraw(L, SP.body.rows, SP.body.at[0], SP.body.at[1]);
  const jy = SP.jaw.at[1] + bob;
  if (o > 0) {
    pixRect(L, 11, jy, 1, o, pal.K);
    pixRect(L, 12, jy, 2, o, pal.D);
    pixRect(L, SP.mouthSpan[0], jy, SP.mouthSpan[1] - SP.mouthSpan[0] + 1, o, '#2a0a12');
    pixRect(L, 16, jy, 1, 1, '#ffffff'); pixRect(L, 19, jy, 1, 1, '#ffffff');
    if (o > 1) pixRect(L, 14, jy + o - 1, 3, 1, '#ff5d7a');

  pixDraw(L, SP.head.rows, SP.head.at[0], SP.head.at[1] + bob);
  const E = SP.eye;
  if (st === 'done') {
    pixRect(L, E.at[0], E.at[1] + bob, 2, 4, pal.B);
    pixDraw(L, SP.happyEye.rows, SP.happyEye.at[0], SP.happyEye.at[1] + bob);
  } else {
    pixDraw(L, DR.blink() ? E.blink : st === 'processing' ? E.up : E.open, E.at[0], E.at[1] + bob);
  }

  // flames: white-hot core cooling through the accent colours
  const ramp = ['#ffffff', acc.hi, bar[1], bar[0], (acc.ring[2] || bar[0])];
  for (const p of DR.fire) {
    const f = p.age / p.life;
    if (p.smoke) {
      x.globalAlpha = 0.5 * (1 - f);
      x.fillStyle = '#a3a3ad';
    } else {
      // fade with age and toward the canvas edge (no hard cut over the bubble)
      x.globalAlpha = (f < 0.65 ? 1 : 1 - (f - 0.65) / 0.35) * clamp01((L.c.width - 0.5 - p.x) / 6);
      x.fillStyle = ramp[f < 0.1 ? 0 : f < 0.25 ? 1 : f < 0.5 ? 2 : f < 0.75 ? 3 : 4];
    }
    const sz = p.smoke ? (p.big && f < 0.6 ? 2 : 1) : f < 0.12 ? 1 : p.big && f < 0.7 ? (f > 0.25 && f < 0.5 ? 3 : 2) : 1;
    x.fillRect(Math.round(p.x - sz / 2), Math.round(p.y - sz / 2), sz, sz);
  }
  // done: a smoke ring drifts off toward the text
  if (st === 'done' && since < 1.1) {
    const f = since / 1.1;
    x.globalAlpha = f < 0.6 ? 1 : 1 - (f - 0.6) / 0.4;
    pixRing(L, Math.round(mouth.x + 3 + f * 7), mouth.y - Math.round(f * 2), Math.round(1 + f * 3.2), f < 0.25 ? '#ffffff' : acc.hi);
  }
  x.globalAlpha = 1;
  pixBlit($('drCv'), L);
}

// ═══ 8. MIMIC ════════════════════════════════════════════════════
// A treasure chest that is secretly alive: the lid is its mouth and opens
// with your voice, glowing eyes peek out of the gap. Processing: it chews.
// Done: jaw wide, tongue out, a few gold coins hop out.
const MM = { L: pixLayer(32, 24), gap: 0, gapAt: 0, oy: 0, vy: 0, coins: [], recAt: -1, doneAt: -1, blink: blinker() };
const MM_PAL = { K: '#2a160c', w: '#b37b47', W: '#8a5a35', d: '#6b4226', G: '#e0a93a', g: '#9a6a1c', O: '#2a160c' };
const MM_TOOTH = '#f5efe2', MM_MOUTH = '#16080d';
function renderMimic(dt, t) {
  const SP = NoTypeSprites.mimic, L = MM.L, ms = now(), acc = ACC();
  pixPalette(L, 'wood', () => MM_PAL);
  const st = S.state, since = sinceState(), x0 = 6;
  if (S.recAt !== MM.recAt) { MM.recAt = S.recAt; MM.oy = -7; MM.vy = 0; MM.gap = 0; MM.coins.length = 0; }
  // entry: drops in and bounces once
  if (MM.oy < 0 || MM.vy < 0) {
    MM.vy += 320 * dt; MM.oy += MM.vy * dt;
    if (MM.oy >= 0) { MM.oy = 0; MM.vy = MM.vy > 45 ? -MM.vy * 0.3 : 0; }
  }
  const landed = MM.oy > -0.5 && MM.vy >= 0;

  let g = 0;
  if (!landed) g = 0;
  else if (st === 'listening') g = talking() ? 1 + Math.round(LIP.o * 5) : 1;
  else if (st === 'processing') g = Math.round(3 * (0.5 - 0.5 * Math.cos(since * Math.PI * 2 * 2.6)));
  else if (st === 'done') g = Math.min(6, Math.round(since / 0.12 * 6));
  if (g !== MM.gap && (ms - MM.gapAt > 60 || st !== 'listening')) { MM.gap = g; MM.gapAt = ms; }
  g = MM.gap;

  if (st === 'done' && MM.doneAt !== S.stateAt) {
    MM.doneAt = S.stateAt;
    for (let i = 0; i < 6; i++) {
      const side = i % 2 ? 1 : -1;
      MM.coins.push({ x: x0 + 9.5 + side * 3, y: 11, vx: side * (11 + Math.random() * 9), vy: -26 - Math.random() * 12,
        age: -0.1 - i * 0.05, life: 0.9 });
    }
  }
  stepParticles(MM.coins, dt, 150, 0);

  // processing: the whole chest bobs up each time the jaw shuts
  const chew = st === 'processing' && g === 0 ? -1 : 0;
  const baseY = 15 + Math.round(MM.oy) + chew, y0 = baseY - g;
  const x = L.x;
  x.clearRect(0, 0, L.c.width, L.c.height);
  if (g > 0) {
    pixRect(L, x0 + 1, y0, 18, g, MM_MOUTH);
    pixRect(L, x0, y0, 1, g, MM_PAL.K); pixRect(L, x0 + 19, y0, 1, g, MM_PAL.K);
    const eyeH = g >= 3 ? 2 : 1, eye = acc.bar[0];
    if (st === 'done') {
      for (const ex of [4, 13]) {
        pixRect(L, x0 + ex + 1, y0, 1, 1, eye);
        pixRect(L, x0 + ex, y0 + 1, 1, 1, eye); pixRect(L, x0 + ex + 2, y0 + 1, 1, 1, eye);
      }
    } else if (!MM.blink()) {
      for (const ex of SP.eyes) {
        if (g >= 2) pixRect(L, x0 + ex - 1, y0, 4, eyeH + 1, mixHex(eye, MM_MOUTH, 0.72));
        pixRect(L, x0 + ex, y0, 2, eyeH, eye);
        if (eyeH > 1) pixRect(L, x0 + ex, y0, 1, 1, acc.hi);
      }
    }
    // fangs at the corners and a pair in the middle hang from the lid
    if (g >= 2) {
      for (const tx of [1, 16]) {
        pixRect(L, x0 + tx, y0, 3, 1, MM_TOOTH);
        if (g >= 3) pixRect(L, x0 + tx + 1, y0 + 1, 1, 1, MM_TOOTH);
      }
      pixRect(L, x0 + 9, y0, 2, 1, MM_TOOTH);
    }
    if (g >= 4) {
      for (const tx of SP.teethBottom) {
        pixRect(L, x0 + tx, baseY - 1, 3, 1, MM_TOOTH);
        if (g >= 5) pixRect(L, x0 + tx + 1, baseY - 2, 1, 1, MM_TOOTH);
      }
      pixRect(L, x0 + 8, baseY - 1, 4, 1, '#ff5d7a');
    }
  }
  pixDraw(L, SP.lid, x0, y0 - SP.lid.length);
  pixDraw(L, SP.base, x0, baseY);
  if (st === 'done' && g >= 6) {                    // tongue out, beside the lock
    pixRect(L, x0 + 12, baseY - 1, 2, 3, '#ff5d7a');
    pixRect(L, x0 + 12, baseY + 2, 2, 1, '#c43a57');
  }
  for (const c of MM.coins) {
    if (c.age < 0) continue;
    x.globalAlpha = c.age / c.life < 0.7 ? 1 : 1 - (c.age / c.life - 0.7) / 0.3;
    const cx = Math.round(c.x), cy = Math.min(22, Math.round(c.y));
    pixRect(L, cx, cy, 2, 2, MM_PAL.G);
    pixRect(L, cx, cy, 1, 1, '#ffe08a');
    if ((ms / 90 | 0) % 2) pixRect(L, cx + 1, cy + 1, 1, 1, MM_PAL.g);
  }
  x.globalAlpha = 1;
  pixBlit($('mmCv'), L);
}

// ═══ 9. SAGE ══════════════════════════════════════════════════════
// One olive stroke with a sage echo behind it, pinned at both ends so it
// reads as a line, not a chart. Low bands swell it, high bands ripple it;
// while it processes it breathes slowly, when the text is in it lies flat
// and a check draws itself in its middle.
const SG = { olive: '#56663a', sage: '#93ab78', amp: 0, ph: 0 };
function renderSage(dt, t) {
  const [ctx, W, H] = prep($('sgLine'));
  const ps = mix.processing, ds = mix.done, mid = H / 2, e = energy();
  const live = 0.07 + e * 0.93;                      // never quite still while listening
  const breath = 0.16 + 0.07 * Math.sin(t * 2.1);
  const target = (live * (1 - ps) + breath * ps) * (1 - ds);
  SG.amp += (target - SG.amp) * (1 - Math.exp(-dt / 0.08));
  SG.ph += dt * (2.2 + e * 3 - ps * 0.8);            // travels faster while you talk
  const w1 = 0.5 + band(0.12), w2 = 0.25 + band(0.4), w3 = 0.12 + band(0.75);
  const norm = 1 / (w1 + w2 + w3), TAU = Math.PI * 2;
  const gap = 16 * ease(ds);                         // the line parts for the check
  const stroke = (shift, k, color, width, alpha) => {
    const A = (H / 2 - width) * SG.amp * k * norm;
    ctx.beginPath();
    let pen = false;
    for (let x = 0; x <= W; x += 1.5) {
      if (Math.abs(x - W / 2) < gap) { pen = false; continue; }
      const u = x / W, env = Math.pow(Math.sin(Math.PI * u), 1.4);
      const y = mid + A * env * (w1 * Math.sin(TAU * 1.3 * u - SG.ph + shift)
        + w2 * Math.sin(TAU * 2.9 * u - SG.ph * 1.6 + shift * 1.3)
        + w3 * Math.sin(TAU * 6.1 * u - SG.ph * 2.3 + shift * 0.7));
      if (pen) ctx.lineTo(x, y); else { ctx.moveTo(x, y); pen = true; }
    }
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  };
  stroke(2.1, 0.72, SG.sage, 2, 0.6 * (1 - ds));     // the echo settles into the line
  stroke(0, 1, SG.olive, 2.2, 1);
  ctx.globalAlpha = 1;
  if (ds > 0.01) drawCheck(ctx, W / 2, mid, 10, doneProgress(), SG.olive, 2.4);
}

const RENDER = {
  amoled: renderAmoled, matrix: renderMatrix, island: renderIsland, halo: renderHalo, buddy: renderBuddy,
  slime: renderSlime, dragon: renderDragon, mimic: renderMimic, sage: renderSage,
};

// ── Text + timer ──────────────────────────────────────────────────
// kind: 'live' (transcript), 'final' (inserted text), 'status' (placeholder)
function setText(text, kind) {
  S.text = text;
  S.hasText = kind !== 'status' && !!text;
  for (const box of document.querySelectorAll('.txt, .is-text')) {
    const span = box.firstElementChild;
    span.textContent = text;
    const island = box.classList.contains('is-text');
    // status: shimmer while working, dim on the matrix (its header already animates)
    span.className = kind !== 'status' || S.state === 'done' ? ''
      : island || box.closest('.s-matrix') ? 'dim' : 'shimmer';
  }
  requestAnimationFrame(updateClip);
}
function updateClip() {
  for (const box of document.querySelectorAll('.txt')) box.classList.toggle('clip', box.scrollWidth > box.clientWidth + 1);
  // bottom-anchored flex column: overflow goes upward and isn't in scrollHeight
  const it = $('isText');
  it.classList.toggle('clip', it.firstElementChild.offsetHeight > it.clientHeight + 1);
}
function timerText() {
  if (!S.recAt) return '0:00';
  const s = Math.max(0, Math.floor(((S.recEnd || now()) - S.recAt) / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
let lastTimer = '';
function tickTimer() {
  const txt = timerText();
  if (txt === lastTimer) return;
  lastTimer = txt;
  for (const el of document.querySelectorAll('[data-timer]')) el.textContent = txt;
}
function setLabel() {
  const lab = S.state === 'processing' ? L().procL : S.state === 'done' ? L().doneL : L().rec;
  $('mxLabel').textContent = lab;
}

// ── State transitions ────────────────────────────────────────────
function setState(st) {
  S.state = st; S.stateAt = now();
  document.body.dataset.state = st;
  document.body.classList.toggle('processing-dim', st === 'processing');
  setLabel();
}
function replayEntry() {
  for (const el of document.querySelectorAll('.shape')) {
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }
}
function recordingStarted(opts) {
  S.command = !!(opts && opts.command);
  document.body.classList.remove('leaving', 'busy', 'cancelled');
  S.leaving = false;
  S.recAt = now(); S.recEnd = 0;
  bandsIn.fill(0); bandsSm.fill(0); levelIn = levelSm = 0;
  IS.w = IS.h = 40; IS.vw = IS.vh = 0;
  $('chips').replaceChildren();
  setState('listening');
  setText(L().listen, 'status');
  replayEntry();
  if (S.sounds && !DEMO) chime('start');
}
function recordingStopped() {
  S.recEnd = now();
  setState('processing');
  if (!S.hasText) setText(L().proc, 'status');
  if (S.sounds && !DEMO) chime('stop');
}
function transcriptionDone(data) {
  if (!data || !data.ok) return;          // error: main.js hides us right away
  setState('done');
  if (data.text) setText(String(data.text), 'final');
  else setText(L().done, 'status');
}
// Esc: main.js hides the window right after; this picks the exit and sound.
function recordingCancelled() {
  if (!S.recEnd) S.recEnd = now();
  document.body.classList.add('cancelled');
  if (S.sounds && !DEMO) chime('cancel');
}
function leaving() {
  S.leaving = true;
  document.body.classList.add('leaving');
}
function busy() {
  if (S.sounds && !DEMO) blip();
  document.body.classList.remove('busy');
  void document.body.offsetWidth;
  document.body.classList.add('busy');
  setTimeout(() => document.body.classList.remove('busy'), 320);
}
function applyStyle(style, opts) {
  style = LEGACY_STYLES[style] || style;
  S.style = STYLES.includes(style) ? style : 'amoled';
  document.body.dataset.style = S.style;
  if (S.style !== 'island') { document.body.style.removeProperty('--chip-pull'); IS.pull = ''; }
  if (opts) {
    if (opts.accent) S.accent = ACCENTS[opts.accent] ? opts.accent : 'mint';
    if (opts.position) S.pos = ['top', 'bottom', 'center'].includes(opts.position) ? opts.position : 'bottom';
    if (typeof opts.sounds === 'boolean') S.sounds = opts.sounds;
    if (typeof opts.strip === 'boolean') document.body.classList.toggle('strip', opts.strip && !DEMO);
  }
  document.body.dataset.accent = S.accent;
  document.body.dataset.pos = S.pos;
  requestAnimationFrame(updateClip);
}
function applyLang(lang) {
  S.lang = I18N[lang] ? lang : 'de';
  document.documentElement.lang = S.lang;
  setLabel();
  if (!S.hasText) {
    const st = S.state === 'processing' ? L().proc : S.state === 'done' ? L().done : L().listen;
    setText(st, 'status');
  }
}

// ── AI context chips ─────────────────────────────────────────────
// One chip per copy that goes along: the screenshot's thumbnail, or the
// start of the copied text. Copied text is user content: textContent only.
const CHIP_TXT = {
  de: { screenshot: 'Screenshot', image: 'Bild', lines: 'Zeilen', quote: ['„', '“'] },
  en: { screenshot: 'Screenshot', image: 'Image', lines: 'lines', quote: ['“', '”'] },
};
const SVG_NS = 'http://www.w3.org/2000/svg';
function textGlyph() {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 12 12');
  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', 'M2 3h8M2 6h8M2 9h5');
  svg.append(path);
  const ico = document.createElement('span');
  ico.className = 'chip-ico';
  ico.append(svg);
  return ico;
}
function addAttachment(a) {
  if (!a || (a.kind !== 'image' && a.kind !== 'text')) return;
  const t = CHIP_TXT[S.lang] || CHIP_TXT.de;
  const chip = document.createElement('div');
  const lbl = document.createElement('span');
  chip.className = 'chip';
  lbl.className = 'chip-lbl';
  if (a.kind === 'image') {
    chip.classList.add('img');
    if (typeof a.thumb === 'string' && a.thumb.startsWith('data:image/png;base64,')) {
      const img = document.createElement('img');
      img.className = 'chip-thumb';
      img.alt = '';
      img.src = a.thumb;
      chip.append(img);
    } else {
      chip.append(textGlyph());
    }
    lbl.textContent = a.source === 'screenshot' ? t.screenshot : t.image;
    chip.append(lbl);
  } else {
    lbl.textContent = t.quote[0] + String(a.preview || '') + t.quote[1];
    chip.append(textGlyph(), lbl);
    if (a.lines > 1) {
      const sub = document.createElement('span');
      sub.className = 'chip-sub';
      sub.textContent = `${a.lines} ${t.lines}`;
      chip.append(sub);
    }
  }
  $('chips').append(chip);
}

// ── Sounds (Web Audio) – short glassy two-note chimes ─────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioContext();
  return audioCtx;
}
function tone(ctx, freq, t0, peak, dur, type) {
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function chime(type) {
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime;
    if (type === 'cancel') {
      // Lower and shorter than the stop chime: dropped, not done.
      [440, 329.63].forEach((f, i) => tone(ctx, f, t + i * 0.07, 0.08, 0.24));
      return;
    }
    const notes = type === 'start' ? [659.25, 987.77] : [987.77, 659.25];
    const peak = type === 'start' ? 0.12 : 0.1;
    notes.forEach((f, i) => {
      tone(ctx, f, t + i * 0.085, peak, 0.42);
      tone(ctx, f * 2, t + i * 0.085, peak * 0.16, 0.22);   // airy overtone
    });
  } catch (_) {}
}
// Hotkey pressed while the previous dictation is still being processed.
function blip() {
  try { const ctx = getAudioCtx(); tone(ctx, 330, ctx.currentTime, 0.08, 0.14, 'triangle'); } catch (_) {}
}

// ── Frame loop (~60 fps cap, idle when hidden) ────────────────────
let lastTs = 0, T = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden) { lastTs = 0; return; }
  if (lastTs && ts - lastTs < 1000 / 60 - 3) return;      // 120/144/240 Hz panels: skip extra frames
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 1 / 60);
  lastTs = ts; T += dt;
  if (DEMO) { if (D.paused) return; demoTick(dt); }
  stepAudio(dt, T);
  stepLip(dt);
  stepMix(dt);
  tickTimer();
  const r = RENDER[S.style];
  if (r) r(dt, T);
}
requestAnimationFrame(frame);

// ── IPC ───────────────────────────────────────────────────────────
if (!DEMO) {
  const nt = window.notype;
  nt.onAmplitude(onAudio);
  nt.onRecordingStarted(recordingStarted);
  nt.onRecordingStopped(recordingStopped);
  if (nt.onTranscriptionDone) nt.onTranscriptionDone(transcriptionDone);
  if (nt.onOverlayLeaving) nt.onOverlayLeaving(leaving);
  if (nt.onRecordingCancelled) nt.onRecordingCancelled(recordingCancelled);
  if (nt.onBusy) nt.onBusy(busy);
  if (nt.onSetStyle) nt.onSetStyle(applyStyle);
  if (nt.onAttachment) nt.onAttachment(addAttachment);
  if (nt.onPreviewEnabled) nt.onPreviewEnabled((on) => { S.preview = !!on; });
  if (nt.onAppLang) nt.onAppLang(applyLang);
  if (nt.onPreviewText) {
    nt.onPreviewText((text) => {
      if (S.preview && text && S.state === 'listening') setText(String(text), 'live');
    });
  }
}

// ── Demo (settings preview) ──────────────────────────────────────
// A scripted dictation on repeat: listen (words appear) → process → done.
const DEMO_TEXT = {
  de: 'Kurzes Update zum Projekt: Das neue Design ist fertig, ich schicke dir die Links heute Nachmittag.',
  en: 'Quick project update: the new design is done, I will send you the links this afternoon.',
};
const D = { t: 0, phase: 'gap', words: 0, syl: 0, paused: false };
function demoTick(dt) {
  D.t += dt;
  if (D.phase === 'gap' && D.t > 0.5) {
    D.phase = 'listen'; D.t = 0; D.words = 0;
    recordingStarted();
  } else if (D.phase === 'listen') {
    // speech-like spectrum: syllables at ~4.5 Hz, formant humps, word gaps
    const words = DEMO_TEXT[S.lang].split(' ');
    const speaking = (D.t % 1.9) < 1.62 && D.t > 0.35;
    D.syl += dt * (4.1 + Math.sin(D.t * 0.9) * 0.8);
    const env = speaking ? Math.pow(Math.abs(Math.sin(D.syl * Math.PI)), 1.4) * (0.75 + 0.25 * Math.sin(D.t * 2.3)) : 0;
    const f1 = 4 + 1.5 * Math.sin(D.t * 1.7), f2 = 9 + 2 * Math.sin(D.t * 1.1 + 1);
    for (let i = 0; i < NB; i++) {
      const shape = 0.95 * Math.exp(-((i - f1) ** 2) / 6) + 0.7 * Math.exp(-((i - f2) ** 2) / 8)
        + 0.25 * Math.exp(-((i - 14) ** 2) / 10) + 0.12;
      bandsIn[i] = clamp01(env * shape * (0.85 + 0.3 * Math.random()));
    }
    haveBands = true; levelIn = env * 0.4;
    const n = Math.min(words.length, Math.floor(Math.max(0, D.t - 0.9) / 0.36));
    if (n !== D.words && S.preview) { D.words = n; if (n > 0) setText(words.slice(0, n).join(' '), 'live'); }
    if (D.t > 0.9 + words.length * 0.36 + 0.5) { D.phase = 'proc'; D.t = 0; recordingStopped(); }
  } else if (D.phase === 'proc' && D.t > 1.1) {
    D.phase = 'done'; D.t = 0;
    transcriptionDone({ ok: true, text: S.preview ? DEMO_TEXT[S.lang] : '' });
  } else if (D.phase === 'done' && D.t > 1.7) {
    D.phase = 'leave'; D.t = 0; leaving();
  } else if (D.phase === 'leave' && D.t > 0.3) {
    D.phase = 'gap'; D.t = 0; setState('idle');
  }
}
if (DEMO) {
  const q = new URLSearchParams(location.search);
  applyStyle(q.get('style') || 'amoled', { accent: q.get('accent') || 'mint', position: 'center', sounds: false });
  applyLang(q.get('lang') || 'de');
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.type !== 'notype-demo') return;
    if (m.lang) applyLang(m.lang);
    if (typeof m.preview === 'boolean') S.preview = m.preview;
    if (typeof m.paused === 'boolean') D.paused = m.paused;
    const restart = m.style && m.style !== S.style;
    applyStyle(m.style || S.style, { accent: m.accent, position: 'center', sounds: false });
    if (restart) { D.phase = 'gap'; D.t = 0.45; }
  });
}
