<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- Local page only: no remote code, no network. Inline scripts and styles need 'unsafe-inline'. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NoType Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gas: #00d4aa;   /* the overlay colour; main.js sends the user's pick */
    --bg: rgba(245, 242, 233, 0.96);
    --fg: #2b3123;
    --sub: rgba(43, 49, 35, 0.72);
    --shadow: rgba(32, 36, 24, 0.22);
    --border: rgba(70, 82, 48, 0.16);
    --accent: #56663a;
    --on-accent: #f9f7f0;
    --warn: #8f5418;
    --ghost-hover: rgba(86, 102, 58, 0.1);
  }
  /* Dark: Neon-Werkstatt. A soot pill with a glass rim; the update button
     is the lit tube, the icon lights while the update runs. */
  [data-theme="dark"] {
    --bg: #171513;
    --fg: #f1ebe1;
    --sub: #a39a8c;
    --shadow: rgba(0, 0, 0, 0.5);
    --border: rgba(241, 235, 225, 0.28);
    --accent: var(--gas);
    --on-accent: #0f0e0d;
    --warn: #ffb547;
    --ghost-hover: rgba(241, 235, 225, 0.08);
    --glass: rgba(241, 235, 225, 0.42);
    --core: color-mix(in srgb, var(--gas) 45%, #fff);
    --halo: 0 0 2px color-mix(in srgb, var(--gas) 90%, transparent), 0 0 9px color-mix(in srgb, var(--gas) 55%, transparent), 0 0 22px color-mix(in srgb, var(--gas) 22%, transparent);
    --halo-text: 0 0 6px color-mix(in srgb, var(--gas) 70%, transparent),
                 0 0 16px color-mix(in srgb, var(--gas) 30%, transparent);
  }

  html, body { background: transparent; }
  body {
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    color: var(--fg);
    backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 8px 8px 14px;
    box-shadow: 0 6px 24px var(--shadow);
    max-width: 580px;
    animation: pillIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .pill.leaving { animation: pillOut 0.25s ease-in forwards; }
  @keyframes pillIn {
    from { opacity: 0; transform: translateY(12px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pillOut {
    to { opacity: 0; transform: translateY(-8px); }
  }

  .icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  .icon svg { width: 13px; height: 13px; }
  .busy .icon { background: var(--accent); color: var(--on-accent); }
  .error .icon { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

  .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .title {
    font-size: 12.5px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    font-size: 11px; color: var(--sub); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }

  .actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: 4px; }
  button {
    font: inherit; border: none; cursor: pointer; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
  }
  .go {
    font-size: 12px; font-weight: 600; padding: 7px 14px;
    background: var(--accent); color: var(--on-accent);
    transition: filter 0.15s, transform 0.1s;
  }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: scale(0.97); }
  .dismiss {
    width: 28px; height: 28px; background: transparent; color: var(--sub);
    transition: background 0.15s, color 0.15s;
  }
  .dismiss:hover { background: var(--ghost-hover); color: var(--fg); }
  .dismiss svg { width: 10px; height: 10px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .busy .actions { display: none; }
  .busy { padding-right: 18px; }

  /* ── Dark: unlit glass until something is on ── */
  [data-theme="dark"] .pill { backdrop-filter: none; }
  [data-theme="dark"] .icon { background: transparent; color: var(--sub); box-shadow: inset 0 0 0 1.5px var(--glass); }
  [data-theme="dark"] .busy .icon { color: var(--core); box-shadow: inset 0 0 0 1.5px var(--gas), var(--halo); }
  /* A failed update is a cracked tube: dashed amber, no glow. */
  [data-theme="dark"] .error .icon { color: var(--warn); box-shadow: none; border: 1.5px dashed var(--warn); }
  [data-theme="dark"] .go {
    background: transparent; color: var(--core); text-shadow: var(--halo-text);
    box-shadow: inset 0 0 0 1.5px var(--gas), inset 0 0 10px color-mix(in srgb, var(--gas) 20%, transparent), var(--halo);
  }
  [data-theme="dark"] .go:hover {
    filter: none;
    box-shadow: inset 0 0 0 1.5px var(--gas), inset 0 0 14px color-mix(in srgb, var(--gas) 32%, transparent), var(--halo);
  }

  /* Ignition: the update button flickers on as the pill arrives, the icon when the update starts. */
  @keyframes ignite {
    0% { opacity: 0.35; } 18% { opacity: 1; } 30% { opacity: 0.45; }
    46% { opacity: 1; } 58% { opacity: 0.8; } 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    [data-theme="dark"] .go { animation: ignite 0.3s steps(1, end) 140ms both; }
    [data-theme="dark"] .busy .icon { animation: ignite 0.3s steps(1, end); }
  }
</style>
</head>
<body>

<div class="pill" id="pill">
  <div class="icon">
    <svg viewBox="0 0 14 14" fill="none" id="iconSvg"></svg>
  </div>
  <div class="body">
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="actions">
    <button class="go" id="go"></button>
    <button class="dismiss" id="dismiss">
      <svg viewBox="0 0 10 10" fill="none"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<script>
  const ICONS = {
    // Arrow into a tray: a new version to fetch.
    download: '<path d="M7 2v6.5M4.2 5.8 7 8.6l2.8-2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 9.5v1A1.5 1.5 0 0 0 4 12h6a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>',
    // Circular arrow: installing, NoType restarts.
    restart: '<path d="M11.2 7a4.2 4.2 0 1 1-1.3-3.05" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M10.3 1.6v2.6H7.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>',
    warn: '<path d="M7 3.6v4.1M7 10.2v.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  };
  const I18N = {
    de: {
      offer: 'NoType {v} ist da',
      offerSub: '{size}lädt im Hintergrund, danach startet NoType neu',
      offerSubPage: 'Die neue Version liegt auf GitHub bereit',
      install: 'Jetzt aktualisieren', page: 'Herunterladen',
      loading: 'Update wird geladen',
      loadingSub: 'Läuft im Hintergrund, den Fortschritt zeigt das Tray-Menü',
      installing: 'NoType wird aktualisiert',
      installingSub: 'Startet in ein paar Sekunden neu',
      error: 'Update fehlgeschlagen',
      errorSub: 'Der Download wurde abgebrochen. Prüfe die Internetverbindung.',
      retry: 'Erneut versuchen', later: 'Später', dec: ',',
    },
    en: {
      offer: 'NoType {v} is here',
      offerSub: '{size}downloads in the background, then NoType restarts',
      offerSubPage: 'The new version is ready on GitHub',
      install: 'Update now', page: 'Download',
      loading: 'Downloading the update',
      loadingSub: 'Runs in the background, the tray menu shows the progress',
      installing: 'Updating NoType',
      installingSub: 'Restarts in a few seconds',
      error: 'Update failed',
      errorSub: 'The download stopped. Check your internet connection.',
      retry: 'Try again', later: 'Later', dec: '.',
    },
  };
  const $ = (id) => document.getElementById(id);
  let L = I18N.de;

  const sizeLabel = (bytes) => {
    if (!bytes) return '';
    const mb = bytes / 1048576;
    const s = mb >= 1000 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
    return s.replace('.', L.dec) + ' · ';
  };

  function render(kind, data) {
    const pill = $('pill');
    pill.className = 'pill' + (kind === 'loading' || kind === 'installing' ? ' busy' : kind === 'error' ? ' error' : '');
    $('iconSvg').innerHTML = kind === 'installing' ? ICONS.restart : kind === 'error' ? ICONS.warn : ICONS.download;
    if (kind === 'offer') {
      $('title').textContent = L.offer.replace('{v}', data.version);
      $('sub').textContent = data.canInstall ? L.offerSub.replace('{size}', sizeLabel(data.size)) : L.offerSubPage;
      $('go').textContent = data.canInstall ? L.install : L.page;
    } else if (kind === 'error') {
      $('title').textContent = L.error;
      $('sub').textContent = L.errorSub;
      $('go').textContent = L.retry;
    } else {
      $('title').textContent = L[kind];
      $('sub').textContent = L[kind + 'Sub'];
    }
    // Starts with the size ("1,0 GB · lädt …") or, without one, a capital.
    const sub = $('sub').textContent;
    $('sub').textContent = sub.charAt(0).toUpperCase() + sub.slice(1);
    $('dismiss').title = L.later;
    $('dismiss').setAttribute('aria-label', L.later);
  }

  if (window.notype) {
    window.notype.onSetTheme((theme, gas) => {
      document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : '';
      if (gas) document.documentElement.style.setProperty('--gas', gas);
    });
    let data = {};
    window.notype.onUpdateData((d) => {
      data = d || {};
      L = I18N[data.lang] || I18N.de;
      render(data.kind, data);
    });
    $('pill').addEventListener('mouseenter', () => window.notype.updateHover(true));
    $('pill').addEventListener('mouseleave', () => window.notype.updateHover(false));
    $('go').onclick = () => {
      window.notype.updateAction('install');
      if (!data.canInstall) { $('pill').classList.add('leaving'); return; }
      render('loading', data);
      setTimeout(() => $('pill').classList.add('leaving'), 2600);
    };
    $('dismiss').onclick = () => {
      $('pill').classList.add('leaving');
      setTimeout(() => window.notype.updateAction('dismiss'), 220);
    };
  }
</script>
</body>
</html>
